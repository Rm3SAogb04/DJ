<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Danjoshi's Wardrobe Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#2c3e50;--paper:#fffdf9;--pink:#ffd6e7;--peach:#ffe5b4;--mint:#caffbf;--sky:#bde0fe;--lilac:#e2c6ff}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f3e5ec;color:var(--ink);font-family:'Press Start 2P','Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',monospace}
button{font:inherit;color:inherit;cursor:pointer}
#app{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;padding:clamp(8px,2vw,22px);gap:clamp(8px,1.5vw,16px);background:radial-gradient(circle at 15% 10%,#fff8df 0 12%,transparent 38%),linear-gradient(135deg,#fbe9f0,#e9f4ff)}
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:clamp(9px,1.5vw,16px);border:3px solid var(--ink);background:linear-gradient(90deg,#ffd6e7,#fff4c8,#cceeff);box-shadow:4px 4px 0 var(--ink)}
.brand{min-width:0}.eyebrow{font-size:clamp(8px,1vw,11px);letter-spacing:1px;color:#8d5273}.brand h1{margin:7px 0 0;font-size:clamp(12px,2vw,21px);line-height:1.5}
#closeBtn{flex:0 0 auto;border:2px solid var(--ink);background:#fff7ed;box-shadow:2px 2px 0 var(--ink);font-size:clamp(17px,2.2vw,25px);width:clamp(34px,4vw,44px);height:clamp(34px,4vw,44px)}
.workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px, min(43%,520px));gap:clamp(8px,1.5vw,16px)}
.preview-panel,.wardrobe-panel{min-width:0;min-height:0;border:3px solid var(--ink);background:rgba(255,253,249,.94);box-shadow:4px 4px 0 rgba(44,62,80,.75)}
.preview-panel{position:relative;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(#dff2ff 0 58%,#d5b18c 58% 100%)}
.preview-label{position:absolute;left:12px;top:12px;padding:8px;background:#fffdf9;border:2px solid var(--ink);font-size:clamp(8px,1vw,11px);z-index:2}
.preview-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative;overflow:hidden}
.preview-stage:before{content:"";position:absolute;bottom:15%;width:min(42%,260px);height:22px;border-radius:50%;background:rgba(44,62,80,.18);filter:blur(2px)}
.avatar{--look:#2c3e50;--accent:#ff69b4;position:relative;width:clamp(100px,20vw,190px);height:clamp(210px,47vh,390px);image-rendering:pixelated;filter:drop-shadow(5px 6px 0 rgba(44,62,80,.18))}
.avatar .hair{position:absolute;top:2%;left:20%;width:60%;height:20%;background:#49352d;border:4px solid var(--ink);z-index:3}
.avatar .head{position:absolute;top:8%;left:25%;width:50%;height:22%;background:#f2c7a5;border:4px solid var(--ink);z-index:2}
.avatar .eye{position:absolute;top:48%;width:7%;height:10%;background:var(--ink);z-index:4}
.avatar .eye.one{left:28%}.avatar .eye.two{right:28%}
.avatar .body{position:absolute;top:29%;left:15%;width:70%;height:42%;background:var(--look);border:4px solid var(--ink);box-shadow:inset 0 -12px 0 var(--accent)}
.avatar .body:before{content:"";position:absolute;left:12%;right:12%;top:15%;height:8%;background:var(--accent)}
.avatar .leg{position:absolute;top:70%;width:25%;height:25%;background:#f2c7a5;border:4px solid var(--ink);border-top:0}
.avatar .leg.one{left:22%}.avatar .leg.two{right:22%}
.avatar .shoe{position:absolute;bottom:0;width:34%;height:8%;background:var(--shoe,#2c3e50);border:4px solid var(--ink)}
.avatar .shoe.one{left:12%}.avatar .shoe.two{right:12%}
.preview-caption{flex:0 0 auto;text-align:center;padding:10px;background:rgba(255,253,249,.86);border-top:2px solid var(--ink);font-size:clamp(8px,1vw,11px);line-height:1.7}
.wardrobe-panel{display:flex;flex-direction:column;overflow:hidden;padding:clamp(10px,1.4vw,16px);gap:10px}
.panel-heading{flex:0 0 auto}.panel-heading h2{font-size:clamp(11px,1.4vw,15px);margin:0 0 7px}.panel-heading p{font:clamp(8px,1vw,10px)/1.8 'Press Start 2P',monospace;opacity:.68;margin:0}
.categories{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.pxbtn{min-width:0;padding:9px 5px;border:2px solid var(--ink);background:#fff7ed;box-shadow:2px 2px 0 var(--ink);font-size:clamp(7px,.9vw,10px);line-height:1.5;overflow-wrap:anywhere}
.pxbtn:hover,.pxbtn:focus-visible{background:var(--mint);outline:2px solid var(--ink)}
.pxbtn.active{background:var(--pink)}
.catalog{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:2px 3px 8px}
.catalog-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:2px 0 9px;font-size:clamp(8px,1vw,10px)}
.look-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.look{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:2px solid var(--ink);background:#fffdf9;box-shadow:2px 2px 0 #c6b4d9;text-align:center}
.look.selected{background:#fff0f6;outline:2px solid #ff69b4}
.swatch-avatar{width:42px;height:52px;position:relative;border:2px solid var(--ink);background:linear-gradient(#f2c7a5 0 28%,var(--look) 28% 82%,#fff 82%);box-shadow:inset 0 -5px 0 var(--accent)}
.swatch-avatar:before{content:"";position:absolute;left:11px;top:3px;width:16px;height:16px;border:2px solid var(--ink);border-radius:50%;background:#f2c7a5}
.swatch-avatar i,.swatch-avatar b{position:absolute;top:12px;width:3px;height:4px;background:var(--ink);z-index:1}.swatch-avatar i{left:13px}.swatch-avatar b{left:25px}
.look-name{font-size:clamp(7px,.9vw,10px);line-height:1.6}.look-desc{font:clamp(7px,.8vw,9px)/1.6 monospace;opacity:.68;min-height:24px}
.swatches{display:flex;gap:4px}.swatches i{width:12px;height:12px;border:1px solid var(--ink)}
.look-state{font-size:clamp(7px,.8vw,9px);color:#9a4771}
.footer-note{flex:0 0 auto;font:clamp(7px,.8vw,9px)/1.6 monospace;opacity:.58;text-align:center}
@media(max-width:700px){#app{padding:7px;gap:7px}.workspace{grid-template-columns:minmax(0, .85fr) minmax(0,1.15fr);gap:7px}.wardrobe-panel{padding:8px;gap:7px}.categories{grid-template-columns:repeat(2,minmax(0,1fr))}.look-grid{grid-template-columns:1fr}.avatar{width:clamp(80px,24vw,140px);height:clamp(180px,42vh,300px)}.preview-label{left:6px;top:6px;padding:6px}}
@media(max-width:430px){.workspace{grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr)}.brand h1{font-size:11px}.preview-caption{padding:6px}.look{padding:7px 4px}}
@media(max-height:520px){#app{padding:6px;gap:6px}.topbar{padding:6px}.workspace{grid-template-columns:minmax(0,1fr) minmax(260px,42%)}.avatar{height:48vh;width:clamp(70px,12vw,120px)}.wardrobe-panel{padding:7px;gap:5px}.look{padding:5px}.swatch-avatar{width:30px;height:38px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar"><div class="brand"><div class="eyebrow">DANJOSHI'S ROOM · CHARACTER STUDIO</div><h1>✿ CREATE A LOOK</h1></div><button id="closeBtn" type="button" aria-label="Return to room">×</button></header>
  <main class="workspace">
    <section class="preview-panel" aria-label="Character preview">
      <div class="preview-label">LIVE PREVIEW</div>
      <div class="preview-stage"><div class="avatar" id="avatar"><div class="hair"></div><div class="head"><i class="eye one"></i><i class="eye two"></i></div><div class="body"></div><div class="leg one"></div><div class="leg two"></div><div class="shoe one"></div><div class="shoe two"></div></div></div>
      <div class="preview-caption" id="previewCaption">DANJOSHI · CLASSIC INK</div>
    </section>
    <section class="wardrobe-panel">
      <div class="panel-heading"><h2>WARDROBE STUDIO</h2><p>Choose a look and make it yours.</p></div>
      <nav class="categories" id="categories" aria-label="Outfit categories"></nav>
      <div class="catalog"><div class="catalog-head"><strong id="categoryTitle">EVERYDAY LOOKS</strong><span id="lookCount"></span></div><div class="look-grid" id="lookGrid"></div></div>
      <div class="footer-note">YOUR LOOK IS SAVED TO THE ROOM AUTOMATICALLY</div>
    </section>
  </main>
</div>
<script>
(() => {
  'use strict';
  const OUTFITS=[
    {id:'classic',label:'CLASSIC INK',main:'#2c3e50',accent:'#ff69b4',shoe:'#2c3e50',desc:'Signature silhouette',category:'EVERYDAY'},
    {id:'strawberry',label:'STRAWBERRY',main:'#ff85b3',accent:'#fffdf9',shoe:'#d6336c',desc:'Sweet berry ribbon',category:'PARTY'},
    {id:'starry',label:'STARRY NIGHT',main:'#3b2f7a',accent:'#ffe66d',shoe:'#1d1b4d',desc:'Midnight gold trim',category:'FORMAL'},
    {id:'minty',label:'MINT SODA',main:'#4ecdc4',accent:'#fffdf9',shoe:'#2b7a78',desc:'Crisp pastel collar',category:'ATHLETIC'},
    {id:'lilac',label:'LILAC DREAM',main:'#9b72cf',accent:'#ffd6e7',shoe:'#5e3c8c',desc:'Soft lavender bow',category:'SLEEP'},
    {id:'sunny',label:'SUNNY DAY',main:'#ffb347',accent:'#ff6b8b',shoe:'#c97a16',desc:'Warm golden pop',category:'SWIM'}
  ];
  const CATEGORIES=['EVERYDAY','FORMAL','ATHLETIC','SLEEP','PARTY','SWIM'];
  const $=id=>document.getElementById(id);
  let currentOutfit='classic',category='EVERYDAY';
  const avatar=$('avatar');
  function render(){
    const outfit=OUTFITS.find(item=>item.id===currentOutfit)||OUTFITS[0];
    avatar.style.setProperty('--look',outfit.main);
    avatar.style.setProperty('--accent',outfit.accent);
    avatar.style.setProperty('--shoe',outfit.shoe);
    $('previewCaption').textContent='DANJOSHI · '+outfit.label;
    $('categories').innerHTML=CATEGORIES.map(item=>'<button class="pxbtn '+(item===category?'active':'')+'" type="button" data-category="'+item+'">'+item+'</button>').join('');
    const shown=OUTFITS.filter(item=>item.category===category);
    $('categoryTitle').textContent=category+' LOOKS';
    $('lookCount').textContent=shown.length+' LOOK'+(shown.length===1?'':'S');
    $('lookGrid').innerHTML=shown.map(item=>'<button class="look '+(item.id===currentOutfit?'selected':'')+'" type="button" data-outfit="'+item.id+'" aria-pressed="'+(item.id===currentOutfit)+'"><span class="swatch-avatar" style="--look:'+item.main+';--accent:'+item.accent+'"><i></i><b></b></span><strong class="look-name">'+item.label+'</strong><span class="look-desc">'+item.desc+'</span><span class="swatches"><i style="background:'+item.main+'"></i><i style="background:'+item.accent+'"></i><i style="background:'+item.shoe+'"></i></span><span class="look-state">'+(item.id===currentOutfit?'✓ SELECTED':'TRY LOOK')+'</span></button>').join('');
  }
  function setOutfit(id,notify=true){
    if(!OUTFITS.some(item=>item.id===id))return;
    currentOutfit=id;
    category=OUTFITS.find(item=>item.id===id).category;
    render();
    if(notify&&window.parent!==window)window.parent.postMessage({djRoom:'dressUpApplyOutfit',outfit:id},'*');
  }
  $('categories').addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;category=button.dataset.category;render();});
  $('lookGrid').addEventListener('click',event=>{const button=event.target.closest('[data-outfit]');if(button)setOutfit(button.dataset.outfit);});
  $('closeBtn').addEventListener('click',()=>{if(window.parent!==window)window.parent.postMessage({djRoom:'closeDressUp'},'*');});
  window.addEventListener('message',event=>{
    if(event.source!==window.parent||!event.data)return;
    if(event.data.djRoom==='dressUpState'&&typeof event.data.outfit==='string')setOutfit(event.data.outfit,false);
  });
  window.addEventListener('keydown',event=>{if(event.key==='Escape'&&window.parent!==window)window.parent.postMessage({djRoom:'closeDressUp'},'*');});
  render();
  if(window.parent!==window)window.parent.postMessage({djRoom:'dressUpReady',outfit:currentOutfit},'*');
})();
</script>
</body>
</html>
