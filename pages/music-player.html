<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Danjoshi's Music Player</title><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#2c3e50;--paper:#fffdf9;--pink:#ffd6e7;--mint:#caffbf}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f3e5ec;color:var(--ink);font-family:'Press Start 2P','Segoe UI Emoji',monospace}button,input{font:inherit;color:inherit}button{cursor:pointer}#app{width:100%;height:100%;display:flex;flex-direction:column;gap:9px;padding:clamp(7px,1.5vw,16px);background:radial-gradient(circle at 15% 10%,#fff8df 0 12%,transparent 38%),linear-gradient(135deg,#fbe9f0,#e9f4ff)}.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border:3px solid var(--ink);background:linear-gradient(90deg,#ffd6e7,#fff4c8,#cceeff);box-shadow:4px 4px 0 var(--ink)}.eyebrow{font-size:8px;color:#8d5273}.topbar h1{margin:7px 0 0;font-size:clamp(12px,2vw,18px);line-height:1.5}#closeBtn{width:36px;height:34px;border:2px solid var(--ink);background:#fff7ed;box-shadow:2px 2px 0 var(--ink);font:28px/1 monospace}.px{padding:9px 10px;border:2px solid var(--ink);background:#fff7ed;box-shadow:2px 2px 0 var(--ink);font-size:9px;line-height:1.6}.px:hover,.px:focus-visible{background:var(--mint);outline:2px solid var(--ink)}.px:disabled{opacity:.45;cursor:not-allowed}.active{background:var(--pink)}#content{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}.home{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:center}.tile{min-height:clamp(95px,20vh,180px);padding:15px;font-size:clamp(9px,1.4vw,14px);line-height:1.8;background:linear-gradient(145deg,#fffdf9,#fff0f6)}.back{display:flex;align-items:center;gap:9px}.back h2{font-size:clamp(10px,1.3vw,14px);line-height:1.6}.panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:9px;border:3px solid var(--ink);background:rgba(255,253,249,.95);box-shadow:4px 4px 0 rgba(44,62,80,.5);overflow:hidden}.note{font:10px/1.7 monospace;opacity:.72;margin:3px 0}.status{font:9px/1.6 monospace;padding:7px;border:1px dashed #8090a0;background:#fff}.list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;display:grid;align-content:start;gap:6px;padding:2px}.entry{display:grid;grid-template-columns:25px 44px minmax(0,1fr);align-items:center;gap:8px;min-height:50px;padding:4px;border:2px solid #aab4bf;background:white}.entry.pick{cursor:pointer}.entry.pick:hover{background:#fff0f6;border-color:#ff69b4}.rank{font:10px monospace;text-align:center;opacity:.7}.entry img,.placeholder{width:44px;height:44px;object-fit:cover;background:#f1e6ef;border:1px solid #aab4bf}.copy{min-width:0;display:flex;flex-direction:column;gap:4px}.copy strong{font:10px/1.5 monospace;overflow-wrap:anywhere}.copy small{font:9px/1.4 monospace;opacity:.7;overflow-wrap:anywhere}.year,.tabs,.actions,.pages,.random{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px}.year strong{font-size:13px;min-width:70px;text-align:center}.search{display:flex;gap:7px}.search input{flex:1;min-width:0;padding:9px;border:2px solid var(--ink);background:white;font:12px monospace}.random,.pages{justify-content:space-between}.pages span{font:9px/1.5 monospace}.results{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}.results .list{flex:1}#playerMount{width:100%;min-height:132px}.player{flex:0 0 auto;border:2px solid var(--ink);background:#f7edf4;padding:7px;display:grid;gap:5px}.player-head{font-size:8px;line-height:1.6}#playerMount{width:100%;min-height:132px}.player-status{font:9px/1.6 monospace;overflow-wrap:anywhere}
@media(max-width:560px){#app{padding:6px;gap:6px}.topbar{padding:7px}.home{gap:7px}.tile{min-height:100px;padding:9px;font-size:9px}.panel{padding:6px;gap:6px}.entry{grid-template-columns:21px 38px minmax(0,1fr);gap:6px}.entry img,.placeholder{width:38px;height:38px}.copy strong{font-size:9px}.copy small{font-size:8px}.px{font-size:8px;padding:8px}.search input{font-size:11px}}
</style></head><body><div id="app"><header class="topbar"><div><div class="eyebrow">DANJOSHI'S ROOM · MUSIC COLLECTIONS</div><h1>♫ MUSIC PLAYER</h1></div><button id="closeBtn" aria-label="Return to room">×</button></header><main id="content"></main></div>
<script>
(function(){'use strict';
var $=function(id){return document.getElementById(id)},content=$('content'),RAW='https://raw.githubusercontent.com/Rm3SAogb04/DJ/refs/heads/main/data/playlists/';
var S={view:'home',archive:{},archiveLoaded:false,archiveLoading:false,archiveError:'',year:String(new Date().getFullYear()),category:'songs',jp:[],jpLoaded:false,jpLoading:false,jpError:'',catalog:[],catalogLoaded:false,catalogLoading:false,catalogError:'',query:'',page:0,random:[],queue:[],index:0,mode:'playlist',playing:false,player:null,request:0,interrupted:null,waiting:false,grant:null,volume:1,muted:false};
var PAGE=30,RANDOM=20;
function post(type,data){if(parent!==window)parent.postMessage(Object.assign({djRoom:type},data||{}),'*');}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function vid(v){var x=String(v||'').trim();if(/^[\w-]{11}$/.test(x))return x;try{var u=new URL(x);if(u.hostname==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||'';if(u.hostname.endsWith('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v')||'';var p=u.pathname.split('/').filter(Boolean);if(['embed','shorts','live'].indexOf(p[0])>=0)return p[1]||'';}}catch(e){}return '';}
function getJson(url){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('Request failed ('+r.status+').');return r.json();});}
function header(t){return '<div class="back"><button class="px" data-a="home">← MUSIC PLAYER</button><h2>'+esc(t)+'</h2></div>';}
function player(){return '<section class="player"><div class="player-head">♫ NOW PLAYING</div><div id="playerMount"></div><div id="playerStatus" class="player-status">Choose a collection to begin.</div><div class="actions"><button class="px" data-a="stop">STOP / CLEAR</button></div></section>';}
function status(t){var e=$('playerStatus');if(e)e.textContent=t;}
function row(x,i,pick){return '<div class="entry '+(pick?'pick':'')+'" '+(pick?'data-song="'+i+'"':'')+'><span class="rank">'+(i+1)+'</span>'+(x.image?'<img src="'+esc(x.image)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'<div class="placeholder"></div>')+'<div class="copy"><strong>'+esc(x.title||'UNKNOWN SONG')+'</strong><small>'+esc(x.artist||x.channel||x.uploader||'')+'</small></div></div>';}
function renderHome(){content.innerHTML='<div class="home"><button class="px tile" data-a="view" data-v="wrapped">YEARLY SPOTIFY WRAPPED</button><button class="px tile" data-a="view" data-v="albums">FAVORITE ALBUMS</button><button class="px tile" data-a="view" data-v="jp">FAVORITE JP SONGS</button><button class="px tile" data-a="view" data-v="archive">JP SONG ARCHIVE</button></div>'+player();}
function render(){if(S.view==='wrapped')wrapped();else if(S.view==='jp')jp();else if(S.view==='archive')archive();else if(S.view==='albums')content.innerHTML=header('FAVORITE ALBUMS')+'<section class="panel"><p class="note">This collection is ready for its albums and artwork.</p></section>'+player();else renderHome();attach();}
function attach(){var h=$('playerMount'),f=S.player&&S.player.getIframe&&S.player.getIframe();if(h&&f&&f.parentNode!==h)h.appendChild(f);}
function normalize(data){var y=data&&data.years&&typeof data.years==='object'?data.years:data;if(!y||typeof y!=='object'||Array.isArray(y))throw Error('Invalid yearly archive.');var o={};Object.keys(y).forEach(function(k){var v=y[k];if(!/^\d{4}$/.test(k)||!v||typeof v!=='object')return;o[k]={};['artists','songs','albums'].forEach(function(c){o[k][c]=(Array.isArray(v[c])?v[c]:[]).map(function(x,i){x=x&&typeof x==='object'?x:{};return {rank:Number(x.rank)||i+1,title:x.title||x.name||x.artist||x.album||'',artist:x.artist||x.artists||'',image:x.image||x.artwork||x.cover||x.imageUrl||'',url:x.youtubeUrl||x.youtube||x.videoUrl||x.video||''};}).sort(function(a,b){return a.rank-b.rank;}).slice(0,5);});});return o;}
function entries(){return S.archive[S.year]&&S.archive[S.year][S.category]||[];}
async function loadWrapped(){if(S.archiveLoaded||S.archiveLoading)return;S.archiveLoading=true;S.archiveError='';render();try{S.archive=normalize(await getJson(RAW+'spotifywrapped.json'));S.archiveLoaded=true;var ys=Object.keys(S.archive).sort();if(!S.archive[S.year]&&ys.length)S.year=ys[ys.length-1];}catch(e){S.archiveError=e.message;}finally{S.archiveLoading=false;render();}}
function wrapped(){var ys=Object.keys(S.archive).sort(),cats=['artists','songs','albums'].filter(function(c){return S.archive[S.year]&&S.archive[S.year][c]&&S.archive[S.year][c].length;}),list=entries();content.innerHTML=header('YEARLY SPOTIFY WRAPPED')+'<section class="panel"><div class="year"><button class="px" data-a="prev" '+(!ys.length?'disabled':'')+'>◀</button><strong>'+esc(S.year)+'</strong><button class="px" data-a="next" '+(!ys.length?'disabled':'')+'>▶</button></div><div class="tabs">'+cats.map(function(c){return '<button class="px '+(S.category===c?'active':'')+'" data-a="cat" data-c="'+c+'">'+c.toUpperCase()+'</button>';}).join('')+'</div>'+(S.archiveLoading?'<p class="note">Loading spotifywrapped.json...</p>':'')+(S.archiveError?'<p class="status">'+esc(S.archiveError)+'</p>':'')+(list.length?'<div class="list">'+list.map(function(x,i){return row({title:x.title,artist:Array.isArray(x.artist)?x.artist.join(', '):x.artist,image:x.image},i,false);}).join('')+'</div>':'<p class="note">Nothing has been added for this year yet.</p>')+'<div class="actions"><button class="px" data-a="playwrapped" '+(!list.some(function(x){return vid(x.url);})?'disabled':'')+'>PLAY '+esc(S.year)+' TOP 5 SONGS</button></div></section>'+player();}
async function loadJp(){if(S.jpLoaded||S.jpLoading)return;S.jpLoading=true;S.jpError='';render();try{var d=await getJson(RAW+'JPtop100.json');if(!d||!Array.isArray(d.entries))throw Error('The JSON does not contain an entries array.');S.jp=d.entries.map(function(x){x=x&&typeof x==='object'?x:{};var t=Array.isArray(x.thumbnails)?x.thumbnails:[];t.sort(function(a,b){return Number(b&&b.width||0)-Number(a&&a.width||0);});return {title:String(x.title||'').trim(),artist:String(x.channel||x.uploader||'').trim(),image:t[0]&&t[0].url||'',videoId:vid(x.id||x.url)};}).filter(function(x){return x.title;});if(!S.jp.length)throw Error('No songs found in entries.');S.jpLoaded=true;}catch(e){S.jpError=e.message;}finally{S.jpLoading=false;render();}}
function jp(){content.innerHTML=header('FAVORITE JP SONGS')+'<section class="panel">'+(S.jpLoading?'<p class="note">Loading JPtop100.json...</p>':'')+(S.jpError?'<p class="status">'+esc(S.jpError)+'</p>':'')+'<div class="list">'+S.jp.map(function(x,i){return row(x,i,false);}).join('')+'</div><div class="actions"><button class="px" data-a="playjp" '+(!S.jp.length?'disabled':'')+'>PLAY TOP 100 SONGS</button></div></section>'+player();}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;}return a;}
function results(){var q=S.query.trim().toLowerCase();return q?S.catalog.filter(function(x){return [x.title,x.artist,x.channel,x.uploader].join(' ').toLowerCase().indexOf(q)>=0;}):[];}
function randomize(){S.random=shuffle(S.catalog).slice(0,RANDOM);S.query='';S.page=0;archive();}
async function loadCatalog(){if(S.catalogLoaded||S.catalogLoading)return;S.catalogLoading=true;S.catalogError='';archive();try{var d=await getJson(RAW+'jp-song-catalog.json'),a=Array.isArray(d)?d:d&&d.songs;if(!Array.isArray(a)||!a.length)throw Error('The song catalogue is empty or invalid.');S.catalog=a.map(function(x){return {title:x.title||'UNKNOWN SONG',artist:x.artist||'',channel:x.channel||'',uploader:x.uploader||'',image:x.image||'',videoId:x.videoId||''};}).filter(function(x){return x.videoId;});S.catalogLoaded=true;S.random=shuffle(S.catalog).slice(0,RANDOM);}catch(e){S.catalogError=e.message;}finally{S.catalogLoading=false;archive();}}
function archive(){var all=results(),pages=Math.max(1,Math.ceil(all.length/PAGE)),start=S.page*PAGE,shown=S.query?all.slice(start,start+PAGE):S.random;content.innerHTML=header('JP SONG ARCHIVE')+'<section class="panel"><div class="search"><input id="songSearch" type="search" placeholder="Search title, artist, or channel..." value="'+esc(S.query)+'" autocomplete="off"><button class="px" data-a="search">SEARCH</button></div><div class="random"><strong>'+ (S.query?'SEARCH RESULTS ('+all.length+')':'RANDOM SONGS')+'</strong><button class="px" data-a="random">NEW RANDOM SONGS</button></div>'+(S.catalogLoading?'<p class="note">Loading song catalogue...</p>':'')+(S.catalogError?'<p class="status">'+esc(S.catalogError)+'</p>':'')+'<div class="results"><div class="list">'+shown.map(function(x,i){return row(x,i,true);}).join('')+'</div>'+(S.query?'<div class="pages"><span>PAGE '+(S.page+1)+' / '+pages+' · '+all.length+' SONGS</span><button class="px" data-a="page" '+(S.page+1>=pages?'disabled':'')+'>NEXT PAGE →</button></div>':'<p class="note">20 random songs from the full catalogue.</p>')+'</div></section>'+player();}
function requestMedia(){return new Promise(function(resolve){if(S.waiting){resolve(false);return;}S.waiting=true;S.grant=resolve;post('musicRequestMedia');setTimeout(function(){if(S.waiting){S.waiting=false;S.grant=null;resolve(false);status('The room could not grant audio. Please try again.');}},5000);});}
function releaseMedia(){post('musicReleaseMedia');S.playing=false;}
function stop(release){S.request++;S.waiting=false;if(S.grant){S.grant(false);S.grant=null;}try{if(S.player){S.player.stopVideo();S.player.destroy();}}catch(e){}S.player=null;S.playing=false;S.queue=[];S.index=0;if($('playerMount'))$('playerMount').innerHTML='';if(release!==false)releaseMedia();status('Playback stopped.');}
function api(){if(window.YT&&YT.Player)return Promise.resolve();if(window.__musicApi)return window.__musicApi;window.__musicApi=new Promise(function(ok,no){var old=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=function(){try{if(typeof old==='function')old();}catch(e){}ok();};var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.async=true;s.onerror=function(){window.__musicApi=null;no(Error('YouTube API failed'));};document.head.appendChild(s);});return window.__musicApi;}
function volume(){if(!S.player)return;try{S.player.setVolume(Math.round((S.muted?0:S.volume)*100));if(S.muted||S.volume<=0)S.player.mute();else S.player.unMute();}catch(e){}}
function nextSequential(){if(!S.player||!S.queue[S.index])return;S.player.loadVideoById(S.queue[S.index]);status('Song '+(S.index+1)+' of '+S.queue.length);}
async function play(ids,mode,resume){ids=(ids||[]).filter(Boolean);if(!ids.length){status('No playable songs in this selection.');return;}if(!await requestMedia())return;stop(false);var req=++S.request;S.queue=ids.slice();S.index=resume?Math.max(0,Math.min(ids.length-1,resume.index||0)):0;S.mode=mode||'playlist';S.playing=true;status('Loading '+ids.length+' songs...');try{await api();if(req!==S.request)return;var mount=$('playerMount');if(!mount)throw Error('Player display unavailable.');mount.innerHTML='<div id="ytMount"></div>';var vars={playsinline:1,rel:0};if(location.origin&&location.origin!=='null')vars.origin=location.origin;S.player=new YT.Player('ytMount',{width:'100%',height:'132',playerVars:vars,events:{onReady:function(e){if(req!==S.request){try{e.target.destroy();}catch(x){}return;}var f=e.target.getIframe&&e.target.getIframe();if(f)f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');volume();if(S.mode==='sequential')nextSequential();else if(S.queue.length>1)e.target.loadPlaylist(S.queue,S.index);else e.target.loadVideoById(S.queue[0]);status('YouTube player ready · use its controls to play or pause.');},onStateChange:function(e){if(req!==S.request)return;if(e.data===1){S.playing=true;post('musicPlaybackState',{playing:true});}else if(e.data===0&&S.mode==='sequential'){S.index++;if(S.index<S.queue.length)nextSequential();else{status('Search queue finished.');releaseMedia();}}else if(e.data===0){status('Playlist finished.');releaseMedia();}else if(e.data===2){S.playing=false;post('musicPlaybackState',{playing:false});}},onError:function(){if(req===S.request){status('This YouTube video cannot be played. Check its availability and embedding permissions.');releaseMedia();}}}});if(resume&&resume.time>0)setTimeout(function(){if(req===S.request&&S.player){try{S.player.seekTo(resume.time,true);S.player.playVideo();}catch(e){}}},1000);}catch(e){status('Could not load YouTube player. Check your connection.');releaseMedia();}}
function playWrapped(){play(entries().filter(function(x){return S.category==='songs';}).map(function(x){return vid(x.url);}),'playlist');}
function playJp(){play(S.jp.map(function(x){return x.videoId;}),'playlist');}
function playArchive(i){var all=S.query?results():S.random,offset=S.query?S.page*PAGE:0;play(all.slice(offset+i).map(function(x){return x.videoId;}),'sequential');}
content.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(b){var a=b.dataset.a;if(a==='home'){S.view='home';render();}else if(a==='view'){S.view=b.dataset.v;render();if(S.view==='wrapped')loadWrapped();if(S.view==='jp')loadJp();if(S.view==='archive')loadCatalog();}else if(a==='prev'||a==='next'){var ys=Object.keys(S.archive).sort(),i=ys.indexOf(S.year);if(ys.length)S.year=ys[Math.max(0,Math.min(ys.length-1,i+(a==='prev'?-1:1)))];render();}else if(a==='cat'){S.category=b.dataset.c;render();}else if(a==='playwrapped')playWrapped();else if(a==='playjp')playJp();else if(a==='stop')stop(true);else if(a==='random')randomize();else if(a==='search'){S.query=$('songSearch')?$('songSearch').value.trim():'';S.page=0;archive();}else if(a==='page'){if((S.page+1)*PAGE<results().length){S.page++;archive();}}}var song=e.target.closest('[data-song]');if(song&&S.view==='archive')playArchive(Number(song.dataset.song));});
content.addEventListener('keydown',function(e){if(e.target&&e.target.id==='songSearch'&&e.key==='Enter'){S.query=e.target.value.trim();S.page=0;archive();}});

$('closeBtn').addEventListener('click',function(){try{if(parent!==window&&typeof parent.__danjoshiCloseMusicPlayer==='function'){parent.__danjoshiCloseMusicPlayer();return;}}catch(e){}post('closeMusicPlayer');});
window.addEventListener('message',function(e){if(e.source!==parent||!e.data)return;var d=e.data;if(d.djRoom==='musicMediaGranted'){S.waiting=false;if(S.grant){var g=S.grant;S.grant=null;g(true);}}else if(d.djRoom==='musicMediaDenied'){S.waiting=false;if(S.grant){var f=S.grant;S.grant=null;f(false);}}else if(d.djRoom==='musicVolume'){S.volume=Math.max(0,Math.min(1,Number(d.volume)||0));S.muted=!!d.muted;volume();}else if(d.djRoom==='musicPause'){if(S.playing&&S.queue.length){S.interrupted={queue:S.queue.slice(),index:S.mode==='sequential'?S.index:Math.max(0,Number(S.player&&S.player.getPlaylistIndex&&S.player.getPlaylistIndex())||0),time:Math.max(0,Number(S.player&&S.player.getCurrentTime&&S.player.getCurrentTime())||0),mode:S.mode};stop(false);post('musicPausedAck');}}else if(d.djRoom==='musicResume'){if(S.interrupted){var x=S.interrupted;S.interrupted=null;play(x.queue,x.mode,{index:x.index,time:x.time});}}else if(d.djRoom==='musicStop'){S.interrupted=null;stop(false);}else if(d.djRoom==='musicDiscardResume'){S.interrupted=null;}});
render();post('musicReady');
})();
</script></body></html>
