<!DOCTYPE html>
<!--
  DANJOSHI'S ROOM — SOURCE MAP

  1. Main room styles and responsive layout
  2. Room scene, HUD, drawers, and interaction overlays
  3. External UFO catcher page (ufo-catcher.html)
  4. Main room runtime
     - Room configuration and base furniture catalog
     - Shared state, persistence, rendering, and inventory
     - Audio, NPC dialogue, movement, and camera
     - Build mode, options, and Pomodoro tools
     - Extended systems: pets, art, ukulele, sleep, journal,
       alarm, coffee, hourly clock, meal check-ins, and gym

  Editing guide:
  - Add standard room furniture in the PROPS catalog.
  - Add companion and wellness systems in the room extension bundle.
  - STORE_KEY-backed data is browser-local; it is not a global publish service.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- YouTube embeds require a usable referrer; keep the origin while omitting the page path. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>DANJOSHI's Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">

  <!-- ===== 1. Styles ===== -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    [hidden] {
      display: none !important;
    }
    :root {
      --ink: #2c3e50;
      --paper: #fffdf9;
      --p-pink: #ffd6e7;
      --p-peach: #ffe5b4;
      --p-butter: #fff9b0;
      --p-mint: #caffbf;
      --p-sky: #bde0fe;
      --p-lilac: #e2c6ff;
    }
    /* Blogger page viewport lock: the room must own the visible browser canvas. */
    html, body {
      background: #f3e5ec !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      overflow: hidden !important;
      position: fixed !important;
      inset: 0 !important;
      font-family: 'Press Start 2P', monospace !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    /* Neutralize Blogger's post column so its width/padding cannot scale or offset the room. */
    .post-body, .entry-content, .post, .blog-posts, #main, main, .main-wrap, article, .hentry {
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
      position: static !important;
      max-width: none !important;
      width: auto !important;
    }
    /* Hide the surrounding blog chrome; keep the room's own HUD and drawers untouched. */
    .site-header, .Header, #header, #navbar, .sidebar, #sidebar, .blog-pager,
    .post-header, .post-footer, .comments, #comments, .site-footer, #footer,
    .blog-header, .blog-footer {
      display: none !important;
    }
    button {
      font-family: inherit;
      color: inherit;
    }
    /* ---------- Stage: fixed design canvas (800x600, or 540x960 in portrait) scaled to fit ---------- */
    #stage {
      --design-w: 800px;
      --design-h: 600px;
      --ui-h: 186px;
      --fs: 20px;
      --scale: 1;
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
      z-index: 2147483000 !important;
      user-select: none;
      -webkit-user-select: none;
      background: transparent;
      overflow: hidden;
    }
    #stage[data-orient="portrait"] {
      --design-w: 540px;
      --design-h: 960px;
      --ui-h: 232px;
      --fs: 17px;
    }
    #frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      box-shadow: none;
      background: transparent;
      overflow: hidden;
    }
    #canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    /* ---------- Shared pixel button ---------- */
    .pxb {
      --hv: #caffbf;
      background: #fff7ed;
      color: var(--ink);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      font-size: 9px;
      line-height: 1.35;
      padding: 7px 8px;
      cursor: pointer;
      text-align: center;
      transition: transform .1s ease, box-shadow .1s ease, background-color .1s ease;
    }
    .pxb:hover, .pxb:focus-visible {
      background: var(--hv);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--ink);
      outline: none;
    }
    .pxb:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--ink);
    }
    .pxb.on {
      background: var(--p-pink);
    }
    /* ---------- Scene / world (the zoomable room) ---------- */
    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: transparent;
    }
    #scene.can-pan {
      cursor: grab;
    }
    #scene.panning {
      cursor: grabbing;
    }
    #world {
      --wall: #fff3d1;
      --floor: #d9a066;
      --tint: rgba(255, 230, 170, .10);
      --sky-a: #bde0fe;
      --sky-b: #e8f6ff;
      --orb: #fff9b0;
      --stars: 0;
      --lamp-o: 0;
      --beam-c: rgba(255, 244, 190, .5);
      --beam-o: .28;
      --claw-o: .15;
      position: absolute;
      left: 0;
      top: 0;
      width: 1220px;
      height: 400px;
      transform-origin: 0 0;
      overflow: hidden;
      background: var(--wall);
      border: none;
      box-shadow: none;
    }
    #world[data-light="evening"] {
      --tint: rgba(255, 140, 70, .17);
      --sky-a: #ff9e7a;
      --sky-b: #ffd6a5;
      --orb: #ffb347;
      --stars: 0;
      --lamp-o: .85;
      --beam-c: rgba(255, 170, 90, .5);
      --beam-o: .2;
      --claw-o: .35;
    }
    #world[data-light="night"] {
      --tint: rgba(28, 22, 96, .40);
      --sky-a: #1d1b4d;
      --sky-b: #3b2f7a;
      --orb: #f4f1ff;
      --stars: 1;
      --lamp-o: 1;
      --beam-c: rgba(170, 190, 255, .45);
      --beam-o: .12;
      --claw-o: .55;
    }
    #world > * {
      position: absolute;
      pointer-events: none;
    }
    /* back wall */
    #wall {
      left: 0;
      top: 0;
      width: 1220px;
      height: 300px;
      background: var(--wall);
      transition: background-color .6s ease;
    }
    #wall::before {
      content: '';
      position: absolute;
      inset: 0;
    }
    #wall::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(44, 62, 80, .16), rgba(44, 62, 80, 0) 28%, rgba(44, 62, 80, 0) 78%, rgba(44, 62, 80, .10));
    }
    #world[data-wall="stripes"] #wall::before {
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .30) 0 28px, rgba(255, 255, 255, 0) 28px 56px);
    }
    #world[data-wall="grid"] #wall::before {
      background: linear-gradient(rgba(44, 62, 80, .10) 2px, transparent 2px) 0 0 / 40px 40px, linear-gradient(90deg, rgba(44, 62, 80, .10) 2px, transparent 2px) 0 0 / 40px 40px;
    }
    #world[data-wall="dots"] #wall::before {
      background: radial-gradient(rgba(255, 255, 255, .5) 3px, transparent 3.5px) 0 0 / 32px 32px;
    }
    #world[data-wall="wainscot"] #wall::before {
      background: linear-gradient(transparent 62%, rgba(44, 62, 80, .22) 62% 63.4%, rgba(255, 255, 255, .22) 63.4%);
    }
    #world[data-wall="stars"] #wall::before {
      background: radial-gradient(rgba(255, 255, 255, .75) 1.6px, transparent 2.2px) 0 0 / 90px 90px, radial-gradient(rgba(255, 255, 255, .5) 1px, transparent 1.6px) 40px 55px / 70px 70px;
    }
    #base {
      left: 0;
      top: 288px;
      width: 1220px;
      height: 12px;
      background: rgba(44, 62, 80, .30);
      border-top: 2px solid rgba(44, 62, 80, .45);
    }
    /* floor */
    #floor {
      left: 0;
      top: 300px;
      width: 1220px;
      height: 100px;
      background: var(--floor);
      transition: background-color .6s ease;
    }
    #floor::before {
      content: '';
      position: absolute;
      inset: 0;
    }
    #floor::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(0, 0, 0, .24), rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, .06));
    }
    #world[data-floor="grid"] #floor::before {
      background: linear-gradient(rgba(44, 62, 80, .20) 2px, transparent 2px) 0 0 / 40px 20px, linear-gradient(90deg, rgba(44, 62, 80, .20) 2px, transparent 2px) 0 0 / 40px 20px;
    }
    #world[data-floor="planks"] #floor::before {
      background: repeating-linear-gradient(rgba(0, 0, 0, .18) 0 2px, transparent 2px 20px), repeating-linear-gradient(90deg, rgba(0, 0, 0, .12) 0 2px, transparent 2px 130px), repeating-linear-gradient(rgba(255, 255, 255, .07) 0 8px, transparent 8px 20px);
    }
    #world[data-floor="tiles"] #floor::before {
      background: linear-gradient(rgba(44, 62, 80, .18) 2px, transparent 2px) 0 0 / 50px 25px, linear-gradient(90deg, rgba(44, 62, 80, .18) 2px, transparent 2px) 0 0 / 50px 25px;
    }
    #world[data-floor="checker"] #floor::before {
      background: conic-gradient(rgba(255, 255, 255, .30) 25%, transparent 0 50%, rgba(255, 255, 255, .30) 0 75%, transparent 0) 0 0 / 50px 50px;
    }
    #world[data-floor="carpet"] #floor::before {
      background: radial-gradient(rgba(255, 255, 255, .28) 1.5px, transparent 2px) 0 0 / 10px 10px;
    }
    #ceil {
      left: 0;
      top: 0;
      width: 1220px;
      height: 30px;
      background: linear-gradient(rgba(44, 62, 80, .30), transparent);
    }
    #edge-l, #edge-r {
      top: 0;
      width: 38px;
      height: 400px;
    }
    #edge-l {
      left: 0;
      background: linear-gradient(90deg, rgba(44, 62, 80, .45), rgba(44, 62, 80, 0));
    }
    #edge-r {
      right: 0;
      background: linear-gradient(270deg, rgba(44, 62, 80, .45), rgba(44, 62, 80, 0));
    }
    /* props (furniture) */
    .prop {
      position: absolute;
      pointer-events: none;
      transform-origin: 50% 100%;
    }
    .prop svg, .claw svg {
      display: block;
      overflow: visible;
    }
    .prop.interactive {
      pointer-events: auto;
      cursor: pointer;
    }
    .prop.interactive::after {
      content: '';
      position: absolute;
      inset: -4px;
      border: 3px solid transparent;
      transition: border-color .15s ease;
      pointer-events: none;
    }
    .prop.interactive:hover::after, .prop.interactive:focus-visible::after {
      border-color: #ff69b4;
    }
    .prop.interactive .hint {
      position: absolute;
      left: 50%;
      top: -28px;
      transform: translate(-50%, 4px);
      opacity: 0;
      white-space: nowrap;
      padding: 4px 8px;
      border: 2px solid #fff;
      border-radius: 999px;
      background: rgba(255, 117, 143, .95);
      color: #fff;
      font-size: 8px;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    .prop.interactive:hover .hint, .prop.interactive:focus-visible .hint {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    #world.editing .prop,
    #world.editing .claw {
      pointer-events: auto;
      cursor: grab;
      outline: 2px dashed rgba(44, 62, 80, .45);
      outline-offset: 2px;
      touch-action: none;
    }
    #world.editing .prop.drag,
    #world.editing .claw.drag {
      cursor: grabbing;
      outline-color: #ff4d8d;
    }
    #world.editing .claw .hint,
    #world.editing .prop .hint {
      display: none;
    }
    #world.editing .prop.interactive::after {
      display: none;
    }
    .sky-a {
      fill: var(--sky-a);
      transition: fill 1.2s ease;
    }
    .sky-b {
      fill: var(--sky-b);
      transition: fill 1.2s ease;
    }
    .orb {
      fill: var(--orb);
      transition: fill 1.2s ease;
    }
    .stars {
      opacity: var(--stars);
      transition: opacity 1.2s ease;
    }
    /* claw machine (static, always in the room) */
    .claw {
      pointer-events: auto !important;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      z-index: 5;
      transform-origin: 50% 100%;
    }
    .claw::after {
      content: '';
      position: absolute;
      inset: -4px;
      border: 3px solid transparent;
      transition: border-color .15s ease;
      pointer-events: none;
    }
    .claw:hover::after, .claw:focus-visible::after {
      border-color: #ff69b4;
    }
    .claw:focus-visible {
      outline: none;
    }
    .claw .hint {
      position: absolute;
      left: 50%;
      top: -30px;
      transform: translate(-50%, 4px);
      opacity: 0;
      white-space: nowrap;
      padding: 4px 9px;
      border: 2px solid #fff;
      border-radius: 999px;
      background: rgba(255, 117, 143, .95);
      color: #fff;
      font-size: 9px;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    .claw:hover .hint, .claw:focus-visible .hint {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .led {
      animation: led 2.6s ease-in-out infinite;
    }
    .arm {
      animation: sway 7s ease-in-out infinite alternate;
    }
    @keyframes led {
      0%, 100% {
        opacity: .35;
      }
      50% {
        opacity: 1;
      }
    }
    @keyframes sway {
      from {
        transform: translateX(-22px);
      }
      to {
        transform: translateX(22px);
      }
    }
    /* lighting layers */
    #tint {
      left: 0;
      top: 0;
      width: 1220px;
      height: 400px;
      background-color: var(--tint);
      transition: background-color 1.2s ease;
      z-index: 20;
    }
    .glow {
      border-radius: 50%;
      z-index: 21;
      transition: opacity 1.2s ease;
    }
    #glow-lamp {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(255, 224, 140, .60), rgba(255, 224, 140, 0) 66%);
      opacity: var(--lamp-o);
    }
    #glow-claw {
      width: 330px;
      height: 330px;
      background: radial-gradient(circle, rgba(255, 150, 215, .50), rgba(255, 150, 215, 0) 66%);
      opacity: var(--claw-o);
    }
    #beam {
      width: 330px;
      height: 290px;
      z-index: 21;
      background-color: var(--beam-c);
      opacity: var(--beam-o);
      clip-path: polygon(0 0, 120px 0, 330px 100%, 180px 100%);
      transition: opacity 1.2s ease, background-color 1.2s ease;
    }
    #vig {
      left: 0;
      top: 0;
      width: 1220px;
      height: 400px;
      z-index: 40;
      background: radial-gradient(ellipse at 50% 55%, rgba(44, 62, 80, 0) 55%, rgba(44, 62, 80, .20) 100%);
    }
    /* ---------- NPC: DANJOSHI + OUTFITS ---------- */
    .npc {
      --outfit-main: #2c3e50;
      --outfit-accent: #ff69b4;
      --outfit-shoe: #2c3e50;
      position: absolute !important;
      left: 0;
      top: 0;
      width: 44px;
      height: 112px;
      z-index: 30;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      pointer-events: auto !important;
      transform-origin: 50% 100%;
    }
    .npc:focus-visible {
      outline: 3px solid #ff4d8d;
      outline-offset: 6px;
    }
    .npc-shadow {
      position: absolute;
      left: -4px;
      right: -4px;
      bottom: -3px;
      height: 10px;
      border-radius: 50%;
      background: rgba(44, 62, 80, .22);
    }
    .npc-fig {
      position: absolute;
      inset: 0;
      display: block;
    }
    .npc-body {
      position: absolute;
      left: 0;
      top: 0;
      width: 44px;
      height: 104px;
      background: var(--outfit-main);
      transform-origin: 50% 100%;
      animation: breathe 3.4s ease-in-out infinite;
      transition: background-color .2s ease;
    }
    .npc-acc {
      position: absolute;
      pointer-events: none;
      transition: all .2s ease;
    }
    .npc[data-outfit="classic"] .npc-acc {
      display: none;
    }
    .npc[data-outfit="strawberry"] .npc-acc {
      display: block;
      left: 4px;
      top: 44px;
      width: 36px;
      height: 10px;
      background: #ff85b3;
      border-top: 2px solid #fffdf9;
      border-bottom: 2px solid #fffdf9;
    }
    .npc[data-outfit="starry"] .npc-acc {
      display: block;
      left: 8px;
      top: 10px;
      width: 28px;
      height: 5px;
      background: #ffe66d;
      box-shadow: 0 38px 0 #ffe66d;
    }
    .npc[data-outfit="minty"] .npc-acc {
      display: block;
      left: 6px;
      top: 48px;
      width: 32px;
      height: 8px;
      background: #fffdf9;
    }
    .npc[data-outfit="lilac"] .npc-acc {
      display: block;
      left: 12px;
      top: 38px;
      width: 20px;
      height: 7px;
      background: #ffd6e7;
    }
    .npc[data-outfit="sunny"] .npc-acc {
      display: block;
      left: 2px;
      top: 42px;
      width: 40px;
      height: 7px;
      background: #ff6b8b;
    }
    .npc[data-facing="back"] .npc-acc {
      opacity: 0.35;
    }
    .eye {
      position: absolute;
      top: 20px;
      width: 7px;
      height: 10px;
      background: var(--paper);
      transform-origin: 50% 50%;
      animation: blink 5.5s steps(1) infinite;
      transition: opacity .16s ease;
    }
    .npc[data-dir="1"] .e1 {
      left: 22px;
    }
    .npc[data-dir="1"] .e2 {
      left: 33px;
    }
    .npc[data-dir="-1"] .e1 {
      left: 4px;
    }
    .npc[data-dir="-1"] .e2 {
      left: 15px;
    }
    .npc[data-facing="back"] .eye {
      opacity: 0;
    }
    .npc-feet i {
      position: absolute;
      bottom: 0;
      width: 15px;
      height: 9px;
      background: var(--outfit-shoe);
      border-top: 2px solid #fffdf9;
      transition: background-color .2s ease;
    }
    .npc-feet i:nth-child(1) {
      left: 5px;
    }
    .npc-feet i:nth-child(2) {
      right: 5px;
    }
    .npc.walking .npc-fig {
      animation: bob .5s steps(2) infinite;
    }
    .npc.walking .npc-feet i:nth-child(1) {
      animation: foot .5s steps(2) infinite;
    }
    .npc.walking .npc-feet i:nth-child(2) {
      animation: foot .5s steps(2) infinite reverse;
    }
    .npc.hop .npc-fig {
      animation: hop .32s ease-out 1;
    }
    @keyframes breathe {
      0%, 100% {
        transform: scaleY(1);
      }
      50% {
        transform: scaleY(1.025);
      }
    }
    @keyframes blink {
      0%, 95%, 100% {
        transform: scaleY(1);
      }
      96%, 99% {
        transform: scaleY(.12);
      }
    }
    @keyframes bob {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-3px);
      }
    }
    @keyframes foot {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-3px);
      }
    }
    @keyframes hop {
      0% {
        transform: translateY(0);
      }
      45% {
        transform: translateY(-14px);
      }
      100% {
        transform: translateY(0);
      }
    }
    .npc-tag {
      position: absolute;
      left: 50%;
      top: -20px;
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 0;
      font-size: 8px;
      letter-spacing: 1px;
      background: none;
      color: var(--ink);
      border: none;
      box-shadow: none;
      text-shadow: -1px -1px 0 var(--p-pink), 1px -1px 0 var(--p-pink), -1px 1px 0 var(--p-pink), 1px 1px 0 var(--p-pink), 0 0 6px #fffdf9;
    }
    .npc-bubble {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 12px);
      width: 196px;
      margin-left: -98px;
      padding: 2px 4px;
      font-size: 9px;
      line-height: 1.5;
      text-align: center;
      color: var(--ink);
      white-space: pre-line;
      background: none;
      border: none;
      box-shadow: none;
      text-shadow: -1px -1px 0 #fffdf9, 1px -1px 0 #fffdf9, -1px 1px 0 #fffdf9, 1px 1px 0 #fffdf9, 0 0 8px #fffdf9;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }
    .npc-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    .npc-bubble::after {
      content: none;
    }
    /* ---------- HUD (top bar) ---------- */
    .hud {
      position: fixed;
      top: 12px;
      left: 14px;
      right: 14px;
      z-index: 26;
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }
    .hud > * {
      pointer-events: auto;
    }
    .sq {
      width: 38px;
      height: 38px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }
    .sq svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .sq.sm {
      width: 34px;
      height: 34px;
      font-size: 13px;
    }
    .marquee {
      flex: 1 1 auto;

  const buildBtn = $('#buildBtn'), optionsBtn = $('#optionsBtn');

  // -----------------------------------------------------------------------------
  // 3. LAYOUT PERSISTENCE AND PROP RENDERING
  // -----------------------------------------------------------------------------
  function clampPropX(w, x) {
    return clamp(x, SIDE_MARGIN + w / 2 - 20, W - SIDE_MARGIN - w / 2 + 20);
  }
  function clampPropY(p, y) {
    if (p.kind === 'wall' || p.kind === 'surface') {
      return clamp(y, 12, 292 - p.h);
    }
    return clamp(y, 302, 392);
  }
  function clampClawY(y) {
    return clamp(y, 302, 392);
  }
  function depthScaleForFloorY(y) {
    const t = clamp((y - 300) / 92, 0, 1);
    return +(0.90 + t * 0.22).toFixed(3);
  }
  function zIndexForFloorY(y, baseZ = 3) {
    const t = clamp((y - 300) / 92, 0, 1);
    return baseZ + Math.round(t * 14);
  }

  const defaultRoom = () => ({
    wall: { style: 'plain', color: 'cream' },
    floor: { style: 'planks', color: 'honey' },
    light: 'evening',
    inventory: [],
    lampLit: true,
    clawX: CLAW.x,
    clawY: CLAW.y,
    props: Object.fromEntries(PROPS.map((p) => [p.id, { on: p.on, variant: 0, x: p.x, y: p.y }]))
  });
  const defaultAudio = () => ({ track: 0, vol: 0.5, muted: false, sfxVol: 0.5, sfxMuted: false });

  let state = defaultRoom();
  let audioPrefs = defaultAudio();
  let needsLegacyGymShift = false;

  function loadSave() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (!d) return;
      needsLegacyGymShift = Number(d.layoutVersion || 1) < 2;
      const base = defaultRoom();
      if (d.wall && WALL_STYLES.some((s) => s[0] === d.wall.style) && WALL_COLORS.some((c) => c[0] === d.wall.color)) base.wall = { style: d.wall.style, color: d.wall.color };
      if (d.floor && FLOOR_STYLES.some((s) => s[0] === d.floor.style) && FLOOR_COLORS.some((c) => c[0] === d.floor.color)) base.floor = { style: d.floor.style, color: d.floor.color };
      if (LIGHTS.some((l) => l[0] === d.light)) base.light = d.light;
      if (Array.isArray(d.inventory)) base.inventory = d.inventory.filter(id => typeof id === 'string');
      if (typeof d.lampLit === 'boolean') base.lampLit = d.lampLit;
      if (typeof d.clawX === 'number') base.clawX = Math.round(clampPropX(CLAW.w, d.clawX + (needsLegacyGymShift ? GYM_OFFSET : 0)));
      if (typeof d.clawY === 'number') base.clawY = Math.round(clampClawY(d.clawY));
      PROPS.forEach((p) => {
        const s = d.props && d.props[p.id];
        if (!s) return;
        const fallbackY = typeof s.top === 'number' && p.kind === 'wall' ? s.top : p.y;
        base.props[p.id] = {
          on: !!s.on,
          variant: clamp(Math.floor(+s.variant || 0), 0, p.variants.length - 1),
          x: Math.round(clampPropX(p.w, typeof s.x === 'number' ? s.x + (needsLegacyGymShift ? GYM_OFFSET : 0) : p.x)),
          y: Math.round(clampPropY(p, typeof s.y === 'number' ? s.y : fallbackY))
        };
      });
      state = base;
      if (d.audio) audioPrefs = { track: clamp(Math.floor(+d.audio.track || 0), 0, TRACKS.length - 1), vol: typeof d.audio.vol === 'number' ? clamp(d.audio.vol, 0, 1) : 0.5, muted: !!d.audio.muted, sfxVol: typeof d.audio.sfxVol === 'number' ? clamp(d.audio.sfxVol, 0, 1) : 0.5, sfxMuted: !!d.audio.sfxMuted };
    } catch (_) { }
  }
  let saveTimer = 0;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify({ ...state, audio: audioPrefs, layoutVersion: 2 })); } catch (_) { } }, 250);
  }

  const propEls = {};
  const glowLamp = $('#glow-lamp'), glowClaw = $('#glow-claw'), beam = $('#beam');

  function placeClaw() {
    const cy = clampClawY(state.clawY);
    const sc = depthScaleForFloorY(cy);
    clawBtn.style.left = (state.clawX - CLAW.w / 2) + 'px';
    clawBtn.style.top = (cy - CLAW.h) + 'px';
    clawBtn.style.transform = `scale(${sc})`;
    clawBtn.style.zIndex = String(zIndexForFloorY(cy, 5));
    glowClaw.style.left = (state.clawX - 165) + 'px';
    glowClaw.style.top = (cy - CLAW.h + 90 - 165) + 'px';
  }

  function placeGlows() {
    const lamp = state.props.lamp, win = state.props.window;
    const lampY = clampPropY(PROP_BY_ID.lamp, lamp.y);
    const lampSc = depthScaleForFloorY(lampY);
    glowLamp.hidden = !lamp.on || !state.lampLit;
    glowLamp.style.left = (lamp.x - 180) + 'px';
    glowLamp.style.top = (lampY - 160 * lampSc + 28 * lampSc - 180) + 'px';
    beam.hidden = !win.on;
    beam.style.left = (win.x - 60) + 'px';
    beam.style.top = (win.y + 6) + 'px';
    placeClaw();
  }

  function buildProps() {
    PROPS.forEach((p) => {
      const el = document.createElement('div');
      el.className = 'prop';
      el.dataset.id = p.id;
      el.style.zIndex = p.z;
      (p.kind === 'rug' ? $('#rugsLayer') : propsLayer).appendChild(el);
      propEls[p.id] = el;
    });
    clawBtn.innerHTML = CLAW_SVG + '<span class="hint">CLICK \u2022 PLAY</span>';
    if (propEls.closet && !propEls.closet.querySelector('.hint')) {
      const h = document.createElement('span');
      h.className = 'hint';
      h.textContent = 'CLOSET \u2022 DRESS UP';
      propEls.closet.appendChild(h);
    }
    Object.assign(clawBtn.style, { width: CLAW.w + 'px', height: CLAW.h + 'px' });
    placeClaw();
  }

  function propTop(p, st) {
    if (p.kind === 'wall') return st.y;
    return st.y - p.h;
  }

  function positionPropEl(p, st, el) {
    el.style.left = (st.x - p.w / 2) + 'px';
    el.style.top = propTop(p, st) + 'px';
    if (p.kind === 'floor') {
      el.style.transform = `scale(${depthScaleForFloorY(st.y)})`;
      el.style.zIndex = String(zIndexForFloorY(st.y, p.z));
    } else if (p.kind === 'rug') {
      el.style.transform = `scale(${depthScaleForFloorY(st.y)})`;
      el.style.zIndex = '0';
    } else {
      el.style.transform = '';
      el.style.zIndex = String(p.z);
    }
  }

  function renderProp(p) {
    const st = state.props[p.id], el = propEls[p.id];
    el.hidden = !st.on;
    el.classList.toggle('lamp-unlit', p.id === 'lamp' && !state.lampLit);
    el.classList.toggle('interactive', p.kind !== 'rug' && !buildOpen);
    el.innerHTML = p.draw(st.variant) + (p.id === 'closet' ? '<span class="hint">CLOSET \u2022 DRESS UP</span>' : '');
    positionPropEl(p, st, el);
    placeGlows();
  }

  function applyRoom() {
    world.dataset.wall = state.wall.style;
    world.dataset.floor = state.floor.style;
    world.dataset.light = state.light;
    world.style.setProperty('--wall', WALL_COLORS.find((c) => c[0] === state.wall.color)[1]);
    world.style.setProperty('--floor', FLOOR_COLORS.find((c) => c[0] === state.floor.color)[1]);
  }
  function renderAllProps() {
    PROPS.forEach(renderProp);
    placeClaw();
    updateInventoryDock();
  }

  function updateInventoryDock() {
    // Compatibility node is kept hidden; the active room inventory is rendered inside Build Mode.
    if (inventoryDockEl) inventoryDockEl.style.display = 'none';
    const ids = Array.isArray(state.inventory) ? state.inventory.filter(id => PROP_BY_ID[id]) : [];
    const count = $('#buildInventoryCount', buildDrawerEl);
    if (count) count.textContent = `${ids.length} ITEM${ids.length === 1 ? '' : 'S'}`;
    const list = $('#buildInventoryItems', buildDrawerEl);
    if (list) list.innerHTML = ids.length ? ids.map(id => buildCatalogCardHtml(PROP_BY_ID[id], true)).join('') : '<div class="inventory-empty">Your room inventory is empty. Store an item or drag it into the inventory drop zone.</div>';
    const drop = $('#buildInventoryDropZone', buildDrawerEl);
    if (drop) drop.dataset.items = String(ids.length);
  }

  function storePropInInventory(id) {
    if (!PROP_BY_ID[id] || !state.props[id]) return;
    if (inventoryStoreHook) { inventoryStoreHook(id); return; }
    if (!state.inventory.includes(id)) state.inventory.push(id);
    state.props[id].on = false;
    renderProp(PROP_BY_ID[id]); updateInventoryDock(); save();
  }
  function restorePropFromInventory(id) {
    if (!PROP_BY_ID[id] || !state.props[id]) return;
    if (inventoryPlaceHook) { inventoryPlaceHook(id); return; }
    state.inventory = state.inventory.filter(item => item !== id);
    state.props[id].on = true;
    renderProp(PROP_BY_ID[id]); updateInventoryDock(); save();
  }
  inventoryToggleEl?.addEventListener('click', () => { inventoryExpanded = !inventoryExpanded; updateInventoryDock(); blip(620, 0.04, 0.05); });
  inventoryDockEl?.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act="inventory-place"]'); if (!b) return;
    if (!buildOpen) { inventoryExpanded = true; updateInventoryDock(); return; }
    restorePropFromInventory(b.dataset.v); blip(740, 0.05, 0.06);
  });

  let dragProp = null;
  world.addEventListener('pointerdown', (e) => {
    if (!buildOpen || e.button !== 0 || placementPendingId) return;
    const el = e.target.closest('.prop, .claw');
    if (!el) return;
    const isClaw = el.classList.contains('claw');
    const id = isClaw ? 'claw' : el.dataset.id;
    const curX = isClaw ? state.clawX : state.props[id].x;
    const curY = isClaw ? state.clawY : state.props[id].y;
    const r = world.getBoundingClientRect();
    dragProp = {
      id,
      isClaw,
      grabX: (e.clientX - r.left) / r.width * W - curX,
      grabY: (e.clientY - r.top) / r.height * H - curY,
      el
    };
    el.classList.add('drag');
    el.setPointerCapture(e.pointerId);
    e.preventDefault(); e.stopPropagation();
  });
  world.addEventListener('pointermove', (e) => {
    if (!dragProp) return;
    const r = world.getBoundingClientRect();
    const wx = (e.clientX - r.left) / r.width * W - dragProp.grabX;
    const wy = (e.clientY - r.top) / r.height * H - dragProp.grabY;
    if (dragProp.isClaw) {
      state.clawX = Math.round(clampPropX(CLAW.w, wx));
      state.clawY = Math.round(clampClawY(wy));
      placeClaw();
    } else {
      const p = PROP_BY_ID[dragProp.id];
      const st = state.props[p.id];
      st.x = Math.round(clampPropX(p.w, wx));
      st.y = Math.round(clampPropY(p, wy));
      positionPropEl(p, st, dragProp.el);
      placeGlows();
    }
  });
  const endPropDrag = () => { if (!dragProp) return; dragProp.el.classList.remove('drag'); dragProp = null; save(); };
  world.addEventListener('pointercancel', endPropDrag);

  // -----------------------------------------------------------------------------
  // 4. AUDIO ENGINE
  // -----------------------------------------------------------------------------
  const bgm = new Audio();
  bgm.loop = true;
  bgm.preload = 'auto';
  let audioWanted = false;
  let triedAlt = false;
  let actx = null;
  const exclusiveMediaSlots = new Set();
  const exclusiveMediaStopHooks = new Map();
  let bgmResumeTimer = 0;
  function registerExclusiveMediaStopper(key, stop) { exclusiveMediaStopHooks.set(key, stop); }
  function claimExclusiveMedia(key) {
    clearTimeout(bgmResumeTimer); bgmResumeTimer = 0;
    Array.from(exclusiveMediaSlots).forEach((other) => {
      if (other === key) return;
      const stop = exclusiveMediaStopHooks.get(other);
      try { if (stop) stop(); } catch (_) {}
      exclusiveMediaSlots.delete(other);
    });
    exclusiveMediaSlots.add(key);
    bgm.pause();
  }
  function releaseExclusiveMedia(key) {
    exclusiveMediaSlots.delete(key);
    if (exclusiveMediaSlots.size) return;
    clearTimeout(bgmResumeTimer);
    bgmResumeTimer = setTimeout(() => {
      bgmResumeTimer = 0;
      if (!exclusiveMediaSlots.size && audioWanted && !audioPrefs.muted && !ufoOpen) bgm.play().catch(() => {});
    }, 3000);
  }
  function hasExclusiveMedia() { return exclusiveMediaSlots.size > 0; }

  function setTrack(i) {
    audioPrefs.track = i;
    triedAlt = false;
    bgm.src = TRACKS[i].url;
    $('#mqText').textContent = '\u266a ' + TRACKS[i].label + (audioPrefs.muted ? '  [MUTED]' : '');
    if (audioWanted && !audioPrefs.muted && !ufoOpen && !hasExclusiveMedia()) bgm.play().catch(() => { });
    save();
  }
  bgm.addEventListener('error', () => {
    const t = TRACKS[audioPrefs.track];
    if (t.alt && !triedAlt) { triedAlt = true; bgm.src = t.alt; if (audioWanted && !audioPrefs.muted && !hasExclusiveMedia()) bgm.play().catch(() => { }); }
  });
  function applyVolume() { bgm.volume = audioPrefs.vol; bgm.muted = audioPrefs.muted; $('#mqText').textContent = '\u266a ' + TRACKS[audioPrefs.track].label + (audioPrefs.muted ? '  [MUTED]' : ''); }
  function startAudio() {
    audioWanted = true;
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { } }
    if (actx && actx.state === 'suspended') actx.resume();
    if (!ufoOpen && !audioPrefs.muted && !hasExclusiveMedia() && bgm.paused) bgm.play().catch(() => { });
  }
  function setMuted(m) { audioPrefs.muted = m; applyVolume(); if (!m) startAudio(); save(); syncOptionsDrawer(); }
  function setSfxMuted(m) { audioPrefs.sfxMuted = !!m; save(); syncOptionsDrawer(); }

  function blip(freq, dur = 0.045, vol = 0.07, type = 'square') {
    if (!actx || audioPrefs.sfxMuted || audioPrefs.sfxVol <= 0) return;
    try {
      const t0 = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(vol * audioPrefs.sfxVol * 2, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (_) { }
  }

  // -----------------------------------------------------------------------------
  // 5. NPC MOVEMENT, AMBIENT BEHAVIOR, AND DIALOGUE
  // -----------------------------------------------------------------------------
  const NPC_MIN_Y = 324, NPC_MAX_Y = 390; // higher = further forward (lower = closer to wall)
  function clampNpcY(y) { return clamp(y, NPC_MIN_Y, NPC_MAX_Y); }

  const npc = { x: 330 + GYM_OFFSET, y: NPC_FEET_Y, dir: 1, facing: 'front', mode: 'idle', t: 2, tx: 330 + GYM_OFFSET, ty: NPC_FEET_Y, speed: 46, ponder: false };
  let talking = false;
  let lastNpcTf = '';
  let lastShift = null;

  function setFacing(f) {
    if (npc.facing !== f) {
      npc.facing = f;
      npcEl.dataset.facing = f;
    }
  }

  function placeNpc() {
    const fy = clampNpcY(npc.y);
    const sc = depthScaleForFloorY(fy);
    const tf = `translate(${(npc.x - 22).toFixed(1)}px,${(fy - 112).toFixed(1)}px) scale(${sc})`;
    npcEl.style.zIndex = String(zIndexForFloorY(fy, 3));
    if (tf !== lastNpcTf) {
      lastNpcTf = tf; npcEl.style.transform = tf;
      const shift = Math.round(clamp(npc.x - 95, 10, W - 200) - (npc.x - 95));
      if (shift !== lastShift) { lastShift = shift; bubbleEl.style.marginLeft = (-95 + shift) + 'px'; bubbleEl.style.setProperty('--shift', shift + 'px'); }
    }
  }
  function setDir(d) { if (npc.dir !== d) { npc.dir = d; npcEl.dataset.dir = d; } }
  function setWalking(on) { npcEl.classList.toggle('walking', on); }

  function startIdle(long) {
    npc.mode = 'idle';
    npc.t = long ? rand(4, 9) : rand(2.2, 6);
    setWalking(false);
    if (Math.random() < 0.35) setFacing('front');
  }

  function walkTo(x, y = npc.y) {
    npc.tx = clamp(x, SIDE_MARGIN + 14, W - SIDE_MARGIN - 14);
    npc.ty = clampNpcY(y);
    const dx = npc.tx - npc.x;
    const dy = npc.ty - npc.y;
    if (Math.hypot(dx, dy) < 12) { startIdle(); return; }
    npc.mode = 'walk';
    if (Math.abs(dx) > 2) setDir(dx > 0 ? 1 : -1);
    if (Math.abs(dy) > 3) setFacing(dy < 0 ? 'back' : 'front');
    else setFacing('front');
    setWalking(true);
  }

  function decide() {
    if (pomo.phase === 'focus' && pomo.followDuringFocus && state.props.desk.on) {
      const deskX = state.props.desk.x + 18;
      const deskY = clampNpcY(state.props.desk.y + 8);
      if (Math.hypot(npc.x - deskX, npc.y - deskY) > 16) {
        walkTo(deskX, deskY);
        npc.ponder = true;
        npc.faceAfter = { x: state.props.desk.x, y: state.props.desk.y - 30 };
        return;
      }
    }
    const r = Math.random();
    if (r < 0.25) {
      setDir(-npc.dir);
      setFacing(Math.random() < 0.25 ? 'back' : 'front');
      npc.t = rand(1.5, 3.2);
      return;
    }
    if (r < 0.72) {
      walkTo(
        rand(SIDE_MARGIN + 14, W - SIDE_MARGIN - 14),
        rand(NPC_MIN_Y, NPC_MAX_Y)
      );
      npc.ponder = false;
      return;
    }
    const spots = PROPS.filter((p) => state.props[p.id].on && p.kind !== 'rug').map((p) => ({ x: p.x, y: p.kind === 'floor' ? p.y : NPC_FEET_Y }));
    spots.push({ x: state.clawX, y: state.clawY });
    const spot = pick(spots);
    npc.ponder = true;
    const targetX = spot.x + rand(-45, 45) + (Math.random() < 0.5 ? -40 : 40);
    const targetY = clampNpcY(spot.y + rand(-18, 22));
    walkTo(targetX, targetY);
    if (npc.mode === 'walk') {
      npc.faceAfter = { x: spot.x, y: spot.y };
    }
  }

  function stepNpc(dt) {
    if (talking) return;
    if (npc.mode === 'walk') {
      const dx = npc.tx - npc.x;
      const dy = npc.ty - npc.y;
      const dist = Math.hypot(dx, dy);
      const step = npc.speed * dt;
      if (dist <= step) {
        npc.x = npc.tx;
        npc.y = npc.ty;
        placeNpc();
        if (npc.faceAfter !== undefined) {
          if (Math.abs(npc.faceAfter.x - npc.x) > 4) setDir(npc.faceAfter.x > npc.x ? 1 : -1);
          setFacing(npc.faceAfter.y < npc.y - 8 ? 'back' : 'front');
          npc.faceAfter = undefined;
        } else {
          setFacing('front');
        }
        startIdle(npc.ponder);
        npc.ponder = false;
      } else {
        const ratio = step / dist;
        npc.x += dx * ratio;
        npc.y += dy * ratio;
        if (Math.abs(dx) > 0.4) setDir(dx > 0 ? 1 : -1);
        if (Math.abs(dy) > 0.35) setFacing(dy < 0 ? 'back' : 'front');
        placeNpc();
      }
    } else {
      npc.t -= dt;
      if (npc.t <= 0) decide();
    }
  }

  let bubbleTimer = 0, ambientT = rand(8, 16);

  // -----------------------------------------------------------------------------
  // 6. CAMERA, VIEWPORT, AND NAVIGATION
  // -----------------------------------------------------------------------------
  const DRAWER_W = 340, DRAWER_H_PORTRAIT = 560;
  let CW = 800, CH = 600, UI_H = 186, portrait = false, canvasScale = 1;
  const cam = { z: 1, tz: 1, cx: MAIN_ROOM_CENTER, cy: H / 2, tcx: MAIN_ROOM_CENTER, tcy: H / 2, follow: true };
  const view = { rx: 0, ry: 0 };
  let buildOpen = false, optionsOpen = false, lastWorldTf = '';
  let buildDrawerExpanded = true;
  let buildCatalogTab = 'FURNITURE';
  let buildCatalogSearch = '';
  let placementPendingId = null;
  let buildCatalogDrag = null;
  let suppressCatalogClickUntil = 0;
  let extraDrawerOpen = false;
  let closeExtraDrawersHook = null;
  const anyDrawerOpen = () => buildOpen || optionsOpen || dressOpen || pomoOpen || bookOpen || sleepOpen || artOpen || extraDrawerOpen;

  function viewMetrics() {
    const vw = Math.max(200, CW - view.rx);
    const vh = Math.max(150, CH - view.ry);
    const fit = Math.max(vw / W, vh / H);
    return { vw, vh, fit, vcx: vw / 2, vcy: vh / 2 };
  }
  function limits(z) { const m = viewMetrics(), s = m.fit * z; return { hx: m.vw / (2 * s), hy: m.vh / (2 * s) }; }
  function clampCenter(x, y, z) {
    const l = limits(z);
    return { x: l.hx >= W / 2 ? W / 2 : clamp(x, l.hx, W - l.hx), y: l.hy >= H / 2 ? H / 2 : clamp(y, l.hy, H - l.hy) };
  }
  function canPanAtBase() { const m = viewMetrics(); const s = m.fit * Math.max(1, cam.tz); return W / 2 > m.vw / (2 * s) + 2; }
  function setZoom(nz, anchor) {
    nz = clamp(nz, ZMIN, ZMAX);
    if (anchor) {
      cam.tcx = anchor.x - (anchor.x - cam.tcx) * (cam.tz / nz);
      cam.tcy = anchor.y - (anchor.y - cam.tcy) * (cam.tz / nz);
      cam.follow = false;
    }
    cam.tz = nz;
    if (nz <= 1.001) { cam.follow = false; cam.tcx = MAIN_ROOM_CENTER; cam.tcy = H / 2; }
    const c = clampCenter(cam.tcx, cam.tcy, nz); cam.tcx = c.x; cam.tcy = c.y;
  }
  function resetCamera() { cam.follow = true; cam.tz = 1; cam.tcx = MAIN_ROOM_CENTER; cam.tcy = H / 2; }
  function worldPoint(clientX, clientY) {
    const r = world.getBoundingClientRect();
    return { x: clamp((clientX - r.left) / r.width * W, 0, W), y: clamp((clientY - r.top) / r.height * H, 0, H) };
  }

  function stepCamera(dt) {
    const k = 1 - Math.exp(-dt * 10);
    const isOpen = anyDrawerOpen();
    // Drawers are overlays now; never shrink or offset the room to make room for them.
    const tgtRx = 0;
    const tgtRy = dialogueOpen ? UI_H : 0;
    view.rx += (tgtRx - view.rx) * k; view.ry += (tgtRy - view.ry) * k;
    if (Math.abs(tgtRx - view.rx) < 0.3) view.rx = tgtRx;
    if (Math.abs(tgtRy - view.ry) < 0.3) view.ry = tgtRy;

    cam.z += (cam.tz - cam.z) * k;
    if (Math.abs(cam.tz - cam.z) < 0.0015) cam.z = cam.tz;

    if (dialogueOpen) {
      cam.follow = false;
      cam.tz = Math.max(cam.tz, 2.05);
      const c = clampCenter(npc.x, clamp(npc.y - 54, 150, 320), cam.tz);
      cam.tcx = c.x;
      cam.tcy = c.y;
    } else if (cam.follow) {
      if (cam.tz > 1.02 || autoFollowNpc) {
        const targetZ = cam.tz > 1.02 ? cam.tz : (autoFollowNpc && (pomo.phase === 'focus' || dressOpen) ? 1.45 : 1);
        if (targetZ !== cam.tz) cam.tz = targetZ;
        const targetY = cam.tz > 1.02 ? clamp(npc.y - 46, 150, 320) : H / 2;
        const targetX = cam.tz > 1.02 ? npc.x : MAIN_ROOM_CENTER;
        const c = clampCenter(targetX, targetY, cam.tz);
        cam.tcx = c.x;
        cam.tcy = c.y;
      } else {
        cam.tcx = MAIN_ROOM_CENTER;
        cam.tcy = H / 2;
      }
    }
    const ke = 1 - Math.exp(-dt * 7);
    cam.cx += (cam.tcx - cam.cx) * ke; cam.cy += (cam.tcy - cam.cy) * ke;

    const m = viewMetrics(), s = m.fit * cam.z;
    const c = clampCenter(cam.cx, cam.cy, cam.z);
    const tx = m.vcx - c.x * s, ty = m.vcy - c.y * s;
    const tf = `translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) scale(${s.toFixed(4)})`;
    if (tf !== lastWorldTf) { lastWorldTf = tf; world.style.transform = tf; }
    scene.classList.toggle('can-pan', (cam.tz > 1.02 || canPanAtBase()) && !isOpen);
  }


  scene.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (ufoOpen) return;
    if (cam.tz <= 1.02 && canPanAtBase() && !e.ctrlKey) {
      const dx = e.shiftKey ? (e.deltaY || e.deltaX) : (e.deltaX || e.deltaY);
      const m = viewMetrics(), sc = m.fit * cam.z;
      cam.follow = false;
      const c = clampCenter(cam.tcx + dx / Math.max(sc, .01), cam.tcy, cam.tz);
      cam.tcx = cam.cx = c.x; cam.tcy = cam.cy = c.y;
      return;
    }
    const f = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0016));
    setZoom(cam.tz * f, worldPoint(e.clientX, e.clientY));
  }, { passive: false });

  let pan = null;
  scene.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || (cam.tz <= 1.02 && !canPanAtBase()) || e.target.closest('button') || e.target.closest('.prop')) return;
    pan = { id: e.pointerId, x: e.clientX, y: e.clientY };
    scene.setPointerCapture(e.pointerId); scene.classList.add('panning');
  });
  scene.addEventListener('pointermove', (e) => {
    if (!pan || e.pointerId !== pan.id) return;
    const m = viewMetrics(), s = m.fit * cam.z * canvasScale;
    const dx = (e.clientX - pan.x) / s, dy = (e.clientY - pan.y) / s;
    pan.x = e.clientX; pan.y = e.clientY;
    cam.follow = false;
    const c = clampCenter(cam.tcx - dx, cam.tcy - dy, cam.tz);
    cam.tcx = cam.cx = c.x; cam.tcy = cam.cy = c.y;
  });

  // The arcade is a normal .html file stored in the DJ repository (NOT GitHub Pages).
  // The room fetches its text and mounts it in iframe.srcdoc, preserving the game's isolation.
  const UFO_GAME_RAW_HTML_URL = 'https://raw.githubusercontent.com/Rm3SAogb04/DJ/refs/heads/main/ufo-catcher.html';

  async function loadRoomPrizeCatalog() {
    if (roomPrizeCatalog.length) return roomPrizeCatalog;
    if (!roomPrizeCatalogPromise) {
      roomPrizeCatalogPromise = fetch(UFO_PRIZE_JSON_URL, { cache: 'no-cache' })
        .then((response) => {
          if (!response.ok) throw new Error(`gft.json request failed (${response.status})`);
          return response.json();
        })
        .then((data) => {
          const rows = Array.isArray(data) ? data : data && data.prizes;
          if (!Array.isArray(rows)) throw new Error('gft.json must contain a prizes array');
          const seen = new Set();
          const safe = rows.map((prize, index) => ({
            id: String(prize && prize.id || `gft-${String(index + 1).padStart(3, '0')}`),
            url: String(prize && prize.url || ''),
            title: String(prize && prize.title || 'UNTITLED PRIZE'),
            caption: String(prize && prize.caption || '')
          })).filter((prize) => {
            if (!/^https:\/\//i.test(prize.url) || seen.has(prize.url)) return false;
            seen.add(prize.url);
            return true;
          });
          if (!safe.length) throw new Error('gft.json contains no usable prize entries');
          roomPrizeCatalog = safe;
          return roomPrizeCatalog;
        })
        .catch((error) => {
          roomPrizeCatalogPromise = null;
          throw error;
        });
    }
    return roomPrizeCatalogPromise;
  }

  function loadUfoGameSource(index) {
    if (!ufoOpen || !ufoFrame) return;
    clearUfoReadyTimer();
    if (ufoFetchController) { try { ufoFetchController.abort(); } catch (_) { } ufoFetchController = null; }
    ufoGameReady = false;

    if (index >= UFO_GAME_SOURCES.length) {
      showUfoLoadError('THE UFO CATCHER FILE COULD NOT LOAD. CHECK THAT ufo-catcher.html IS COMMITTED TO THE DJ REPOSITORY, OR ADD A BLOGGER FALLBACK URL.');
      return;
    }

    const source = UFO_GAME_SOURCES[index];
    ufoOverlay.classList.remove('ready');

    // Timeout covers both downloading the separate HTML file and its game-ready handshake.
    ufoReadyTimer = setTimeout(() => {
      if (!ufoOpen || ufoGameReady) return;
      if (ufoFetchController) { try { ufoFetchController.abort(); } catch (_) { } ufoFetchController = null; }
      if (index + 1 < UFO_GAME_SOURCES.length) {
        loadUfoGameSource(index + 1);
      } else {
        showUfoLoadError('THE UFO CATCHER DID NOT FINISH INITIALIZING. CHECK THE RAW FILE URL, gft.json, AND YOUR INTERNET CONNECTION.');
      }
    }, UFO_GAME_READY_TIMEOUT_MS);

    if (source.type === 'page') {
      // Optional Blogger fallback: load a published page directly in the iframe.
      ufoFrame.src = source.url;
      return;
    }

    const controller = new AbortController();
    ufoFetchController = controller;
    fetch(source.url, { cache: 'no-cache', mode: 'cors', signal: controller.signal })
      .then((response) => {
        if (!response.ok) throw new Error(`ufo-catcher.html request failed (${response.status})`);
        return response.text();
      })
      .then((html) => {
        if (!ufoOpen || !ufoFrame || controller.signal.aborted || ufoFetchController !== controller) return;
        // Guard against uploading the wrong file or a GitHub 404/error page.
        if (!/<!doctype\s+html/i.test(html) || !html.includes('id="arcadeStage"') || !html.includes('id="ufoCanvas"')) {
          throw new Error('The fetched file is not the expected standalone UFO catcher HTML.');
        }
        ufoFetchController = null;
        // srcdoc runs the fetched page in an isolated iframe while inheriting the room's origin.
        // This keeps game logic separate but lets the room and game exchange prize progress safely.
        ufoFrame.srcdoc = html;
      })
      .catch((error) => {
        if (controller.signal.aborted || !ufoOpen) return;
        console.error('Could not fetch standalone UFO catcher HTML:', error);
        clearUfoReadyTimer();
        if (index + 1 < UFO_GAME_SOURCES.length) loadUfoGameSource(index + 1);
        else showUfoLoadError('CANNOT FETCH ufo-catcher.html FROM GITHUB RAW. CHECK THE FILE NAME, PUBLIC REPOSITORY, AND gft.json URL.');
      });
  }

  function getRoomUnlockedPrizes() {
    let saved = roomPrizeMessageReceived ? roomPrizeMessageCache : [];

      try {
        const stored = JSON.parse(localStorage.getItem('danjoshiRoom.ufoPrizeAlbum.v1') || '[]');
        if (Array.isArray(stored)) saved = stored;
      } catch (_) { /* Private browsing can disable storage; keep the in-memory copy. */ }
    }
    if (!Array.isArray(saved)) saved = [];
    const valid = new Map(roomPrizeCatalog.map((prize) => [prize.url, prize]));

  function renderRoomPrizePage() {
    if (!roomPrizeGrid) return;

    const totalPages = Math.max(1, Math.ceil(Math.max(roomPrizeCatalog.length, roomPrizeUnlocked.length) / roomPrizePageSize));
    roomPrizePage = Math.max(0, Math.min(roomPrizePage, totalPages - 1));
    roomPrizeGrid.innerHTML = '';
    const startIndex = roomPrizePage * roomPrizePageSize;
    for (let i = 0; i < roomPrizePageSize; i++) {

        earMarkup +
        accSvg +
        rc(19, 16, 2, 3, INK) + rc(27, 16, 2, 3, INK) +
        rc(16, 34, 4, 6, bodyCol) + rc(28, 34, 4, 6, bodyCol)
      );
    }

    const petPoops = [];
    let petPoopSequence = 0;
    function spawnPetPoop(pet) {
      const item = { id: `pet-poop-${++petPoopSequence}`, x: clamp(pet.x + (pet.id === 'dog' ? 12 : -10), 24, W - 24), y: pet.y + 3, el: null };
      const el = document.createElement('span');
      el.className = 'tama-rainbow-poop';
      el.textContent = '💩';
      el.setAttribute('aria-label', 'Rainbow pet poop. Click to clean up.');
      el.style.left = `${item.x - 17}px`;
      el.style.top = `${item.y - 31}px`;
      el.style.zIndex = String(zIndexForFloorY(item.y, 47));
      el.dataset.petPoopId = item.id;
      item.el = el;
      world.appendChild(el);
      petPoops.push(item);
    }
    function clearPetPoop(id) {
      const index = petPoops.findIndex(item => item.id === id);
      if (index < 0) return false;
      petPoops[index].el?.remove();
      petPoops.splice(index, 1);
      return true;
    }

    // Focus robot: a single-task queue that moves to one pet/poop, completes it,
    // then selects the next task. It never runs concurrent care actions.
    const focusRobotState = { x: 0, y: 0, task: null, phase: 'idle', timer: 0, el: null };
    function ensureFocusRobot() {
      if (focusRobotState.el && focusRobotState.el.isConnected) return focusRobotState.el;
      const robot = document.createElement('div');
      robot.className = 'focus-care-robot';
      robot.setAttribute('aria-label', 'Robot pet-care assistant');
      robot.innerHTML = '<span class="focus-care-bot">🤖</span><small>CARE BOT</small><b class="focus-care-task">READY</b>';
      world.appendChild(robot);
      focusRobotState.el = robot;
      return robot;
    }
    function focusRobotNextTask() {
      if (petPoops.length) {
        const item = petPoops[0];
        return { kind: 'CLEAN', poopId: item.id, x: item.x, y: item.y + 2 };
      }
      const pets = Object.values(tamaState.pets).filter(p => !p.outside);
      const priorities = [
        { kind: 'FEED', key: 'hunger', threshold: 78, amount: 34 },
        { kind: 'BATH', key: 'cleanliness', threshold: 76, amount: 34 },
        { kind: 'PLAY', key: 'happiness', threshold: 76, amount: 32 }
      ];
      for (const priority of priorities) {
        const needy = pets.filter(p => Number(p[priority.key]) < priority.threshold).sort((a, b) => a[priority.key] - b[priority.key])[0];
        if (needy) {
          needy.focusBotFrozen = true;
          needy.mode = 'idle';
          needy.t = 999999;
          return { kind: priority.kind, key: priority.key, amount: priority.amount, petId: needy.id, x: needy.x + 24, y: needy.y + 2 };
        }
      }
      return null;
    }
    function finishFocusRobotTask() {
      const task = focusRobotState.task;
      if (!task) return;
      if (task.kind === 'CLEAN') {
        clearPetPoop(task.poopId);
        retroSfx.play('bath');
      } else {
        const pet = tamaState.pets[task.petId];
        if (pet) {
          pet[task.key] = clamp(Number(pet[task.key] || 0) + task.amount, 0, 100);
          pet.focusBotFrozen = false;
          pet.mode = 'idle';
          pet.t = rand(2.2, 5.5);
          if (task.kind === 'FEED') pet.happiness = clamp(pet.happiness + 4, 0, 100);
          if (task.kind === 'BATH') pet.happiness = clamp(pet.happiness + 3, 0, 100);
          if (task.kind === 'PLAY') pet.hunger = clamp(pet.hunger - 1, 0, 100);
          retroSfx.play(task.kind === 'FEED' ? 'feed' : task.kind === 'BATH' ? 'bath' : 'play');
        }
      }
      renderPets();
      focusRobotState.task = null;
      focusRobotState.phase = 'idle';
      focusRobotState.timer = 0;
    }
    function stepFocusRobot(dt) {
      if (!focusModeActive) return;
      const el = ensureFocusRobot();
      if (!focusRobotState.task) {
        focusRobotState.task = focusRobotNextTask();
        if (focusRobotState.task) focusRobotState.phase = 'moving';
      }
      const task = focusRobotState.task;
      if (task && focusRobotState.phase === 'moving') {
        const dx = task.x - focusRobotState.x;
        const dy = task.y - focusRobotState.y;
        const distance = Math.hypot(dx, dy);
        const speed = 118 * dt;
        if (distance <= Math.max(5, speed)) {
          focusRobotState.x = task.x; focusRobotState.y = task.y;
          focusRobotState.phase = 'working'; focusRobotState.timer = task.kind === 'CLEAN' ? 1.0 : 1.35;
        } else {
          focusRobotState.x += dx / distance * speed;
          focusRobotState.y += dy / distance * speed;
        }
      } else if (task && focusRobotState.phase === 'working') {
        focusRobotState.timer -= dt;
        if (focusRobotState.timer <= 0) finishFocusRobotTask();
      } else if (!task) {
        const desk = state.props.desk;
        const idleX = desk ? desk.x - 82 : MAIN_ROOM_CENTER;
        const idleY = desk ? desk.y + 3 : PROP_BASE_Y;
        focusRobotState.x += (idleX - focusRobotState.x) * Math.min(1, dt * 2);
        focusRobotState.y += (idleY - focusRobotState.y) * Math.min(1, dt * 2);
      }
      el.style.left = `${(focusRobotState.x - 20).toFixed(1)}px`;
      el.style.top = `${(focusRobotState.y - 44).toFixed(1)}px`;
      el.classList.toggle('working', focusRobotState.phase === 'working');
      const label = el.querySelector('.focus-care-task');
      if (label) label.textContent = task ? (focusRobotState.phase === 'working' ? `${task.kind}…` : task.kind) : 'READY';
    }

    function renderPets() {
      Object.values(tamaState.pets).forEach((pet) => {
        const el = petEls[pet.id];
        if (!el) return;
        el.hidden = !!pet.outside;
        if (pet.outside) return;
        const sc = depthScaleForFloorY(pet.y) * 0.92;
        const hopY = pet.hop > 0 ? -Math.sin(pet.hop * Math.PI) * 9 : 0;
        el.style.zIndex = '46';
        // 64x58 hit target; center the 48x42 sprite so the visible pet stays in the same world position.
        el.style.transform = `translate(${(pet.x - 32).toFixed(1)}px, ${(pet.y - 48 + hopY).toFixed(1)}px) scaleX(${pet.dir * sc}) scaleY(${sc})`;
        const hBar = Math.round(pet.hunger / 20);
        const cBar = Math.round(pet.cleanliness / 20);
        const pBar = Math.round(pet.happiness / 20);
        el.innerHTML =
          `<span class="pet-tag">${pet.id.toUpperCase()}</span>` +
          drawPetSvg(pet) +
          `<span class="pet-stat-mini" title="Hunger / Clean / Happy">` +
          `<i style="background:${hBar >= 2 ? '#ffe66d' : '#ff6b8b'}"></i>` +
          `<i style="background:${cBar >= 2 ? '#6ec6ff' : '#ff6b8b'}"></i>` +
          `<i style="background:${pBar >= 2 ? '#6ee7b7' : '#ff6b8b'}"></i>` +
          `</span>`;
      });
    }

    // Render placed items on couch & displayShelf + live wall/desk clocks

    if (typeof renderProp === 'function') {
      const baseRenderProp = renderProp;
      renderProp = function (p) {
        baseRenderProp(p);
        const st = state.props[p.id];

            items.forEach((itemId) => {

    function updateClocks() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      const str = `${hh}:${mm}:${ss}`;
      document.querySelectorAll('.live-clock-readout').forEach((n) => { n.textContent = str; });
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // Time-of-day sky + Jakarta weather sync.
    // Open-Meteo supplies the current model condition; a BMKG Tanjung Priok
    // reflectivity image must also contain radar echoes before rain is shown.
    // If the radar image cannot be read (including browser CORS restrictions),
    // the game deliberately stays clear instead of guessing.
    const BMKG_JKT_RADAR_IMAGE_URL = 'https://inderaja.bmkg.go.id/Radar/TANG_SingleLayerCRefQC.png';
    const BMKG_JKT_RADAR_PAGE_URL = 'https://www.bmkg.go.id/cuaca/radar';
    const BMKG_JKT_RADAR_CACHE_MS = 5 * 60 * 1000;
    let bmkgJktRadarCache = null;
    let bmkgJktRadarCacheAt = 0;
    let bmkgJktRadarPending = null;

    world.dataset.jktWeather = 'clear';
    world.dataset.jktWeatherStatus = 'starting';

    // BMKG reflectivity products use saturated colour bands (blue/cyan/green/yellow/
    // orange/red/purple) for radar returns. Read only the radar PNG; no external
    // pixel proxy or third-party weather service is used.
    function inspectBmkgJakartaRadar(forceRefresh = false) {
      const now = Date.now();
      if (!forceRefresh && bmkgJktRadarCache && now - bmkgJktRadarCacheAt < BMKG_JKT_RADAR_CACHE_MS) {
        return Promise.resolve(bmkgJktRadarCache);
      }
      if (bmkgJktRadarPending) return bmkgJktRadarPending;

      bmkgJktRadarPending = new Promise((resolve) => {
        const img = new Image();
        let finished = false;
        const finish = (result) => {
          if (finished) return;
          finished = true;
          clearTimeout(timeoutId);
          if (result) {
            bmkgJktRadarCache = result;
            bmkgJktRadarCacheAt = Date.now();
          }
          bmkgJktRadarPending = null;
          resolve(result);
        };
        const timeoutId = setTimeout(() => finish(null), 9000);

        // CORS is required for reading radar pixels. If BMKG does not allow it,
        // onerror/getImageData will fail safely and the game will not invent rain.
        img.crossOrigin = 'anonymous';
        img.referrerPolicy = 'strict-origin-when-cross-origin';
        img.onload = () => {
          try {
            const width = img.naturalWidth || img.width;
            const height = img.naturalHeight || img.height;
            if (!width || !height) return finish(null);
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            if (!ctx) return finish(null);
            ctx.drawImage(img, 0, 0, width, height);
            const pixels = ctx.getImageData(0, 0, width, height).data;
            const step = Math.max(1, Math.floor(Math.min(width, height) / 420));
            let samples = 0;
            let echoPixels = 0;

            for (let y = Math.floor(height * 0.04); y < Math.floor(height * 0.96); y += step) {
              for (let x = Math.floor(width * 0.04); x < Math.floor(width * 0.96); x += step) {
                const i = (y * width + x) * 4;
                const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2], a = pixels[i + 3];
                samples++;
                if (a < 170) continue;
                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                if (max < 75 || max - min < 42) continue;
                const saturation = (max - min) / Math.max(1, max);
                if (saturation < 0.38) continue;

                let hue;
                const delta = max - min;
                if (max === r) hue = 60 * (((g - b) / delta) % 6);
                else if (max === g) hue = 60 * ((b - r) / delta + 2);
                else hue = 60 * ((r - g) / delta + 4);
                if (hue < 0) hue += 360;

                // BMKG's reflectivity palette is colourful; pale basemap/labels are filtered out.
                const radarHue = (hue <= 78) || (hue >= 82 && hue <= 190) ||
                  (hue >= 194 && hue <= 285) || (hue >= 300);
                if (radarHue) echoPixels++;
              }
            }
            const threshold = Math.max(12, samples * 0.00012);
            finish({ available: true, active: echoPixels >= threshold, echoPixels, samples, checkedAt: Date.now() });
          } catch (_) {
            // A tainted canvas means the source did not grant cross-origin pixel access.
            finish(null);
          }
        };
        img.onerror = () => finish(null);
        img.src = `${BMKG_JKT_RADAR_IMAGE_URL}?_=${Date.now()}`;
      });
      return bmkgJktRadarPending;
    }

    function getSkyPeriod(d = new Date()) {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
      }).formatToParts(d);
      const hour = Number(parts.find((part) => part.type === 'hour')?.value || 0);
      const minute = Number(parts.find((part) => part.type === 'minute')?.value || 0);
      const m = hour * 60 + minute;
      if (m >= 300 && m < 390) return 'dawn';
      if (m >= 390 && m < 480) return 'sunrise';
      if (m >= 480 && m < 720) return 'morning';
      if (m >= 720 && m < 990) return 'afternoon';
      if (m >= 990 && m < 1095) return 'sunset';
      if (m >= 1095 && m < 1170) return 'dusk';
      return 'night';
    }

    // Small permanent source credit; click it to inspect BMKG's live radar map.
    const jktWeatherCredit = document.createElement('a');
    jktWeatherCredit.className = 'jkt-weather-credit';
    jktWeatherCredit.href = BMKG_JKT_RADAR_PAGE_URL;
    jktWeatherCredit.target = '_blank';
    jktWeatherCredit.rel = 'noopener noreferrer';
    jktWeatherCredit.textContent = 'WEATHER: OPEN-METEO  ·  RADAR: BMKG';
    jktWeatherCredit.title = 'Open BMKG weather radar. Rain animation requires both Open-Meteo rain conditions and BMKG radar echoes.';
    world.appendChild(jktWeatherCredit);

    async function refreshTimeAndJakartaWeather() {
      world.dataset.sky = getSkyPeriod(new Date());
      try {
        const weatherUrl = 'https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456' +
          '&current=weather_code,precipitation,rain,showers&hourly=precipitation_probability' +
          '&forecast_days=1&timezone=Asia%2FJakarta';
        const [weatherResponse, radarEvidence] = await Promise.all([
          fetch(weatherUrl, { cache: 'no-store' }),
          inspectBmkgJakartaRadar()
        ]);
        if (!weatherResponse.ok) throw new Error(`Jakarta weather request failed (${weatherResponse.status})`);
        const json = await weatherResponse.json();
        const current = json?.current || {};
        const rawCode = current.weather_code;
        if (rawCode === null || rawCode === undefined || !Number.isFinite(Number(rawCode))) {
          world.dataset.jktWeather = 'clear';
          world.dataset.jktWeatherStatus = radarEvidence ? 'no-current-weather-code' : 'radar-unavailable';
          return;
        }
        if (!radarEvidence || !radarEvidence.available) {
          world.dataset.jktWeather = 'clear';
          world.dataset.jktWeatherStatus = 'radar-unavailable';
          return;
        }

        const code = Number(rawCode);
        // Open-Meteo current precipitation/rain/showers are preceding-hour totals.
        // They only corroborate the instantaneous weather code; they cannot trigger rain by themselves.
        const recentRainMm = Math.max(
          Number.isFinite(Number(current.precipitation)) ? Number(current.precipitation) : 0,
          Number.isFinite(Number(current.rain)) ? Number(current.rain) : 0,
          Number.isFinite(Number(current.showers)) ? Number(current.showers) : 0
        );
        const hourlyTimes = Array.isArray(json?.hourly?.time) ? json.hourly.time : [];
        const currentHourKey = String(current.time || '').slice(0, 13) + ':00';
        const hourIndex = hourlyTimes.indexOf(currentHourKey);
        const precipProbability = hourIndex >= 0 && Array.isArray(json?.hourly?.precipitation_probability)
          ? Number(json.hourly.precipitation_probability[hourIndex]) || 0
          : 0;

        const isThunderstorm = code >= 95 && code <= 99;
        const isRainCode = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code);
        const openMeteoRainConfirmed = (isRainCode || isThunderstorm) &&
          (recentRainMm >= 0.1 || precipProbability >= 45);

        if (radarEvidence.active && openMeteoRainConfirmed && isThunderstorm) {
          world.dataset.jktWeather = 'stormy';
          world.dataset.jktWeatherStatus = 'confirmed-storm';
        } else if (radarEvidence.active && openMeteoRainConfirmed && isRainCode) {
          world.dataset.jktWeather = 'rainy';
          world.dataset.jktWeatherStatus = 'confirmed-rain';
        } else {
          world.dataset.jktWeather = 'clear';
          world.dataset.jktWeatherStatus = radarEvidence.active ? 'radar-echo-no-local-rain-agreement' : 'radar-clear';
        }
        world.dataset.jktWeatherUpdated = new Date().toISOString();
      } catch (_) {
        // Never leave rain running after a failed or incomplete data refresh.
        world.dataset.jktWeather = 'clear';
        world.dataset.jktWeatherStatus = 'weather-unavailable';
      }
    }
    refreshTimeAndJakartaWeather();
    setInterval(refreshTimeAndJakartaWeather, 5 * 60 * 1000);

    // Pet care & wandering step loop
    let petDecayAccum = 0;
    function stepTamaPets(dt) {
      petDecayAccum += dt;
      if (petDecayAccum >= 12) {
        petDecayAccum -= 12;
        Object.values(tamaState.pets).forEach((p) => {
          p.hunger = clamp(p.hunger - 1, 0, 100);
          p.cleanliness = clamp(p.cleanliness - 1, 0, 100);
          p.happiness = clamp(p.happiness - 1, 0, 100);
        });
      }
      Object.values(tamaState.pets).forEach((p) => {
        if (p.focusBotFrozen) return;
        if (p.outside) {
          if (Date.now() >= p.outsideUntil) {
            p.outside = false; p.outsideUntil = 0; p.mode = 'idle'; p.t = rand(2.2, 5.2);
            p.x = clamp(p.x, SIDE_MARGIN + 24, W - SIDE_MARGIN - 24);
            p.happiness = clamp(p.happiness + 9, 0, 100);
            if (dressOpen && tamaState.simsTab === p.id) buildDressDrawer();
            say(`${p.name} is back from a little walk!`, 2300);
          }
          return;
        }
        p.poopIn = (Number(p.poopIn) || 120) - dt;
        if (p.poopIn <= 0) { spawnPetPoop(p); p.poopIn = 135 + Math.random() * 115; }
        if (p.hop > 0) p.hop = Math.max(0, p.hop - dt * 2.4);
        if (p.mode === 'walk') {
          const dx = p.tx - p.x;
          const dy = p.ty - p.y;
          const dist = Math.hypot(dx, dy);
          const spd = 34 * dt;
          if (dist <= spd) {
            p.x = p.tx; p.y = p.ty; p.mode = 'idle'; p.t = rand(2.2, 5.5);
          } else {
            p.x += (dx / dist) * spd;
            p.y += (dy / dist) * spd;
            if (Math.abs(dx) > 0.3) p.dir = dx > 0 ? 1 : -1;
          }
        } else {
          p.t -= dt;
          if (p.t <= 0) {
            if (Math.random() < 0.7) {
              p.tx = rand(SIDE_MARGIN + 20, W - SIDE_MARGIN - 20);
              p.ty = rand(NPC_MIN_Y, NPC_MAX_Y);
              p.mode = 'walk';
            } else {
              p.dir = -p.dir;
              p.t = rand(1.6, 3.6);
            }
          }
        }
      });
      renderPets();
    }

    cancelAnimationFrame(raf);
    function upgradedTick(now) {
      raf = requestAnimationFrame(upgradedTick);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (dt <= 0) return;
      stepPomodoro(dt);
      stepSleep(dt);
      stepNpc(dt);
      stepTamaPets(dt);
      stepFocusRobot(dt);
      stepAmbient(dt);
      stepCamera(dt);
    }
    raf = requestAnimationFrame(upgradedTick);

    // Follow & Call helpers for NPC, Cat, and Dog
    // 10.4 NPC follow and call behavior.
    function applyFollowChoice(choice) {
      tamaState.followChoice = choice;
      autoFollowNpc = choice !== 'none';
      if (choice !== 'none') cam.follow = true;
      syncAutoFollowUi();

    function callEntity(who) {

    // Upgrade bottom quick-action bar with target choices (NPC / Cat / Dog)
    const bottomBar = $('#bottomDrawerBar');
    if (bottomBar) {
      bottomBar.innerHTML = `
      <div class="drawer-group">
        <button class="pxb" id="callTargetBtn" type="button">☎ CALL: NPC</button>
        <button class="pxb" id="cycleCallBtn" type="button">✧ WHO: NPC</button>
        <button class="pxb on" id="followTargetBtn" type="button">♡ FOLLOW: NPC</button>
      </div>`;
      const callBtn = $('#callTargetBtn');
      const whoBtn = $('#cycleCallBtn');
      const folBtn = $('#followTargetBtn');
      const order = ['npc', 'cat', 'dog'];
      const labels = { npc: 'NPC', cat: 'CAT', dog: 'DOG', none: 'OFF' };

      const syncBar = () => {
        callBtn.textContent = `CALL ${labels[tamaState.callChoice]}`;
        whoBtn.textContent = `TARGET: ${labels[tamaState.callChoice]}`;
        folBtn.textContent = `FOLLOW: ${labels[tamaState.followChoice]}`;
        folBtn.classList.toggle('on', tamaState.followChoice !== 'none');
      };
      whoBtn.addEventListener('click', () => {
        const idx = (order.indexOf(tamaState.callChoice) + 1) % order.length;
        tamaState.callChoice = order[idx];
        retroSfx.play('blip');
        syncBar();
      });
      callBtn.addEventListener('click', () => { callEntity(tamaState.callChoice); syncBar(); });
      folBtn.addEventListener('click', () => {
        const seq = ['npc', 'cat', 'dog', 'none'];
        const next = seq[(seq.indexOf(tamaState.followChoice) + 1) % seq.length];

    const LIVESTREAM_JSON_URL = 'https://raw.githubusercontent.com/Rm3SAogb04/DJ/refs/heads/main/livestream.json';
    let livestreamItems = [];
    let livestreamLoaded = false;
    let livestreamLoading = false;

    function cleanLivestreamEntry(entry, index) {
      if (!entry || typeof entry !== 'object') return null;
      const platform = String(entry.platform || '').toLowerCase();
      if (!['youtube', 'twitch'].includes(platform)) return null;
      const url = String(entry.url || entry.videoUrl || entry.channelUrl || '').trim();
      if (!url || !/^https:\/\//i.test(url)) return null;
      const enabled = entry.enabled !== false && String(entry.status || '').toLowerCase() !== 'offline';
      const parsedRank = Number(entry.rank);
      const rank = Number.isFinite(parsedRank) && parsedRank > 0 ? parsedRank : 9999;
      return { id: String(entry.id || `stream-${index + 1}`).slice(0, 80), title: String(entry.title || `${platform.toUpperCase()} LIVESTREAM`).slice(0, 100), platform, url, rank, enabled, order: index };
    }

    async function loadLivestreamList(force = false) {
      if (livestreamLoadPromise) return livestreamLoadPromise;
      if (livestreamLoaded && !force) return;
      livestreamLoading = true;
      livestreamLoadError = '';
      livestreamLoadPromise = (async () => {
        try {
          const response = await fetch(LIVESTREAM_JSON_URL, { cache: 'no-store', mode: 'cors' });
          if (!response.ok) throw new Error(`livestream.json request failed (${response.status})`);
          const data = await response.json();
          const raw = Array.isArray(data) ? data : data && Array.isArray(data.streams) ? data.streams : [];
          livestreamItems = raw.map(cleanLivestreamEntry).filter(Boolean).filter(item => item.enabled)
            .sort((a, b) => a.rank - b.rank || a.order - b.order);
          livestreamLoaded = true;
        } catch (error) {
          livestreamLoadError = error && error.message ? error.message : 'Could not load livestream.json';
          livestreamItems = [];
        } finally {
          livestreamLoading = false;
          livestreamLoadPromise = null;
        }
      })();
      return livestreamLoadPromise;
    }

    function buildLivestreamEmbedUrl(entry) {
      if (!entry) return '';
      if (entry.platform === 'youtube') {
        try {
          const host = new URL(entry.url).hostname.toLowerCase().replace(/^www\./, '');
          if (!(host === 'youtube.com' || host === 'youtu.be' || host.endsWith('.youtube.com'))) return '';
        } catch (_) { return ''; }
        const id = youtubeVideoId(entry.url);
        if (!id) return '';
        return `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&mute=1&playsinline=1&rel=0`;
      }
      if (entry.platform === 'twitch') {
        try {
          const u = new URL(entry.url);
          const host = u.hostname.toLowerCase().replace(/^www\./, '');
          if (host !== 'twitch.tv') return '';
          const parts = u.pathname.split('/').filter(Boolean);
          const player = new URL('https://player.twitch.tv/');
          if (parts[0] === 'videos' && parts[1] && /^\d+$/.test(parts[1])) player.searchParams.set('video', `v${parts[1]}`);
          else if (parts[0] && !['directory', 'downloads', 'p', 'settings'].includes(parts[0].toLowerCase())) player.searchParams.set('channel', parts[0]);
          else return '';
          player.searchParams.set('parent', location.hostname);
          player.searchParams.set('autoplay', 'true');
          player.searchParams.set('muted', 'true');
          return player.toString();
        } catch (_) { return ''; }
      }
      return '';
    }

    function renderTvStream() {

      const title = $('#tvStreamTitle', tvDrawer);

      if (!mount) return;

        mount.innerHTML = `<div class="tv-idle">${livestreamLoadError ? 'COULD NOT LOAD LIVESTREAM.JSON' : 'NO STREAMS ADDED YET'}<small>${escapeUiText(livestreamLoadError || 'Add enabled YouTube or Twitch entries to livestream.json. Rank 1 is tried first.')}</small></div>`;
        if (status) status.textContent = livestreamLoadError ? 'SOURCE ERROR' : 'WAITING FOR STREAM LIST';
        if (title) title.textContent = 'NO LIVESTREAM SELECTED';
        if (nextButton) nextButton.disabled = true;
        return;
      }
      const src = buildLivestreamEmbedUrl(entry);
      if (!src) {
        mount.innerHTML = '<div class="tv-idle">UNSUPPORTED STREAM LINK · CHECK YOUR JSON URL</div>';
        if (status) status.textContent = 'INVALID STREAM URL';
