  function resetHeartsVisual() {
    heartsContainer.classList.remove('active');
    bigExplodingHeart.style.cssText = 'transform: translate(-50%, -50%) scale(0.1); opacity: 0; animation: none;';
    emptyHearts.forEach(el => el.classList.remove('empty-heart-visible'));
    stackFills.forEach(el => el.setAttribute('fill', '#fffdf9'));
  }

  function triggerHeartSequence() {
    isAnimating = true;
    heartsContainer.classList.add('active');

    bigExplodingHeart.style.cssText = 'transform: translate(-50%, -50%) scale(1); opacity: 1; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease-out; animation: none;';

    emptyHearts.forEach((el, index) => {
      setTimeout(() => {
        el.classList.add('empty-heart-visible');
      }, 700 + (index * 90));
    });

    setTimeout(() => {
      bigExplodingHeart.style.transition = 'none';
      bigExplodingHeart.style.animation = 'heart-throb-twice 0.8s cubic-bezier(0.36, 0, 0.66, 1) 1 forwards';
    }, 350);

    setTimeout(() => {
      bigExplodingHeart.style.animation = 'none';

      const sceneRect = sceneEl.getBoundingClientRect();
      const heartRect = targetHeart.getBoundingClientRect();
      const bigRect = bigExplodingHeart.getBoundingClientRect();

      const startCenterX = sceneRect.left + (sceneRect.width / 2);
      const startCenterY = sceneRect.top + (sceneRect.height / 2);

      const targetCenterX = heartRect.left + (heartRect.width / 2);
      const targetCenterY = heartRect.top + (heartRect.height / 2);

      const targetX = targetCenterX - startCenterX;
      const targetY = targetCenterY - startCenterY;

      const targetScale = heartRect.width / bigRect.width;

      const duration = 750;
      const startTime = performance.now();

      function slideFrame(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = 1 - (1 - progress) * (1 - progress);

        const currentX = targetX * easeProgress;
        const currentY = targetY * easeProgress;
        const currentScale = 1 + (targetScale - 1) * easeProgress;
        const currentOpacity = 1 - easeProgress;

        bigExplodingHeart.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px)) scale(${currentScale})`;
        bigExplodingHeart.style.opacity = currentOpacity;

        if (progress < 1) {
          requestAnimationFrame(slideFrame);
        } else {
          isAnimating = false;
        }
      }

      requestAnimationFrame(slideFrame);
    }, 2100);

    for (let step = 0; step < 3; step++) {
      setTimeout(() => stackFills[step].setAttribute('fill', '#ff758f'), 2700 + step * 250);
    }
  }

  const storyScript = [
    { speaker: "DANJOSHI", text: "Hello there~" },
    {
      speaker: "DANJOSHI",
      text: "What brings you here? Are you lost?",
      choices: [
        { label: "I'm just bored...", nextIndex: 2 },
        { label: "I don't know either...", nextIndex: 3 },
        { label: "I wanted to see you...", nextIndex: 11 }
      ]
    },
    { speaker: "DANJOSHI", text: "I see. Come check out some of my stuff here then!", nextIndex: 9 },
    { speaker: "DANJOSHI", text: "Is that so...? Take your time then...", nextIndex: 4 },
    { speaker: "DANJOSHI", text: "...", nextIndex: 5 },
    { speaker: "DANJOSHI", text: "......", nextIndex: 6 },
    { speaker: "DANJOSHI", text: ".........", nextIndex: 7 },
    { speaker: "DANJOSHI", text: "............", nextIndex: 8 },
    {
      speaker: "DANJOSHI",
      text: "(This is a bit awkward.)",
      choices: [
        { label: "I'm bored now.", nextIndex: 2 },
        { label: "I want to leave.", nextIndex: 10 }
      ]
    },
    {
      speaker: "DANJOSHI",
      text: "I may or may not add more stuff in the future.",
      choices: [
        { label: "CRANE GAME + browse illustrations I received from cool people.", scene: "ufo" },
      ]
    },
    { speaker: "DANJOSHI", text: "I guess I'll see you around.", end: true },
    {
      speaker: "DANJOSHI",
      text: "Aww shucks, that makes me happy~ teeheehee",
      nextIndex: 12,
      triggerAnimation: true
    },
    {
      speaker: "DANJOSHI",
      text: "(What's that? Something just popped-up on the screen's top-right...)",
      nextIndex: 13,
      keepHearts: true
    },
    {
      speaker: "DANJOSHI",
      text: "(Ahh- No way...! Is that what I think it is...?)",
      end: true,
      keepHearts: true
    }
  ];

  function isDialogueOpen() {
    return activeScript !== null;
  }

  function areChoicesVisible() {
    return choicesEl.classList.contains('active');
  }

  function renderNode(index) {
    const node = activeScript && activeScript[index];
    if (!node) return;

    currentIndex = index;
    speakerEl.textContent = node.speaker || '';

    if (node.triggerAnimation) {
      triggerHeartSequence();
    } else if (node.keepHearts) {
      heartsContainer.classList.add('active');
      bigExplodingHeart.style.cssText = 'transform: translate(calc(-50% + 340px), calc(-50% - 260px)) scale(0.28); opacity: 0; animation: none;';
      emptyHearts.forEach(el => el.classList.add('empty-heart-visible'));
      stackFills.forEach((el, idx) => {
        el.setAttribute('fill', idx < 3 ? '#ff758f' : '#fffdf9');
      });
    } else {
      resetHeartsVisual();
    }

    choicesEl.innerHTML = '';
    choicesEl.classList.remove('active');
    nextEl.style.display = 'none';
    clearKbFocus();
    updateCursorVisibility();

    clearInterval(typeTimer);
    textEl.textContent = '';
    currentFullText = node.text;
    isTyping = true;

    let charIdx = 0;
    typeTimer = setInterval(() => {
      if (charIdx < currentFullText.length) {
        textEl.textContent += currentFullText.charAt(charIdx);
        charIdx++;
      } else {
        finishTyping(node);
      }
    }, 30);
  }

  function finishTyping(node) {
    clearInterval(typeTimer);
    textEl.textContent = currentFullText;
    isTyping = false;

    if (node.choices && node.choices.length > 0) {
      node.choices.forEach((choice) => {
        const btn = document.createElement('button');
        btn.className = 'vn-choice-btn';
        btn.textContent = choice.label;
        bindRandomPastelHover(btn);
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (isAnimating) return;

          choicesEl.classList.remove('active');
          clearKbFocus();
          updateCursorVisibility();

          if (choice.scene) window.parent.postMessage({ djScene: choice.scene }, '*');

          if (choice.nextIndex !== undefined) {
            renderNode(choice.nextIndex);
          }
        });
        choicesEl.appendChild(btn);
      });
      choicesEl.classList.add('active');
      modeState.choiceFocusIdx = 0;
      if (modeState.mode === 'wasd-arrows') {
        applyChoiceKbFocus(0);
      }
      updateCursorVisibility();
    } else {
      nextEl.style.display = 'block';
      updateCursorVisibility();
    }
  }

  function startDialogue(script, index = 0, source = null) {
    if (isSettingsOpen()) setSettingsOpen(false);
    activeScript = script;
    activeSource = source;
    if (dialogueWrapperEl) dialogueWrapperEl.classList.add('is-open');
    updateJoysticksVisibility();
    renderNode(index);
  }

  function endDialogue() {
    const lastNode = activeScript && activeScript[currentIndex];
    clearInterval(typeTimer);
    isTyping = false;
    activeScript = null;
    activeSource = null;
    if (dialogueWrapperEl) dialogueWrapperEl.classList.remove('is-open');
    textEl.textContent = '';
    speakerEl.textContent = '';
    choicesEl.innerHTML = '';
    choicesEl.classList.remove('active');
    nextEl.style.display = 'none';
    clearKbFocus();
    updateJoysticksVisibility();
    updateCursorVisibility();
    if (!(lastNode && lastNode.keepHearts)) resetHeartsVisual();
  }

  function triggerInteract() {
    if (isSettingsOpen()) return;
    startBgm();
    if (isAnimating) return;

    if (activeScript) {
      if (areChoicesVisible()) return;
      const node = activeScript[currentIndex];
      if (isTyping) finishTyping(node);
      else if (node.url) goTop(node.url);
      else if (node.end) endDialogue();
      else if (!node.choices) {
        const next = node.nextIndex !== undefined ? node.nextIndex : currentIndex + 1;
        if (activeScript[next]) renderNode(next); else endDialogue();
      }
      return;
    }

    const target = findAimedInteractable();
    if (target) target.onInteract();
  }

  dialogueBox.addEventListener('pointerdown', (e) => {
    registerMousePress(e);
    if (e.pointerType !== 'mouse' || e.button !== 0 || !isMouseAllowed()) return;
    e.stopPropagation();
    triggerInteract();
  });

  const EXTRAS = {
    sprintMultiplier: 1.6,
    stepsPerSecond: 2.6,
    bobAmp: 4.5,
    leanDeg: 1.4,
    breatheAmp: 0.8,
    shardCount: 5,
    shardMinRadius: 150,
    shardMaxRadius: 340
  };

  const BASE_MAX_SPEED = TUNING.maxSpeed;
  const rigEl = document.getElementById('fp-camera-rig');
  let sprintHeld = false;
  let stepPhase = 0;
  let lastPrompt = null;
  let lastBlipAt = 0;
  let audioCtx = null;
  let shardsFound = 0;

  const SHARD_FINALE = [
    { speaker: 'SYSTEM', text: '\u2726 You collected every sparkle shard! \u2726' },
    { speaker: 'SYSTEM', text: 'The room hums happily. Thanks for exploring~', end: true }
  ];

  function playTone({ freq, dur = 0.06, type = 'square', vol = 0.1, slideTo = null }) {
    const level = (bgmAudio && bgmAudio.muted ? 0 : bgmVolume) * vol;
    if (level <= 0) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const t0 = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      gain.gain.setValueAtTime(level, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (_) {}
  }

  function playFootstep(speed) {
    playTone({ freq: 110 + Math.random() * 25 + speed * 15, dur: 0.07, type: 'triangle', vol: 0.3, slideTo: 45 });
  }

  function playChime() {
    [660, 880, 1320].forEach((freq, i) => {
      setTimeout(() => playTone({ freq, dur: 0.18, type: 'sine', vol: 0.2 }), i * 90);
    });
  }

  new MutationObserver(() => {
    if (!isTyping) return;
    const now = performance.now();
    if (now - lastBlipAt < 40) return;
    lastBlipAt = now;

    const voice = [...speakerEl.textContent].reduce((sum, ch) => sum + ch.charCodeAt(0), 0) % 6;
    playTone({ freq: 280 + voice * 45 + Math.random() * 20, dur: 0.045, vol: 0.08 });
  }).observe(textEl, { childList: true, characterData: true, subtree: true });

  function updateFeel(dt) {
    const speed = Math.hypot(player.velF, player.velR) / BASE_MAX_SPEED;

    const stepBefore = Math.floor(stepPhase);
    stepPhase += dt * speed * EXTRAS.stepsPerSecond;
    if (speed > 0.15 && Math.floor(stepPhase) !== stepBefore) playFootstep(speed);

    const bob = -Math.abs(Math.sin(stepPhase * Math.PI)) * EXTRAS.bobAmp * Math.min(speed, 1.4);
    const sway = Math.sin(performance.now() / 1000 * Math.PI * 0.7) * EXTRAS.breatheAmp * Math.max(0, 1 - speed * 2);
    const lean = clamp(player.velR / BASE_MAX_SPEED, -1, 1) * EXTRAS.leanDeg;

    rigEl.style.transform = `translateZ(var(--cam-focal)) translateY(${(bob + sway).toFixed(2)}px) rotateZ(${(-lean).toFixed(2)}deg)`;
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') sprintHeld = isKeyboardAllowed();
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') sprintHeld = false;
  });
  window.addEventListener('blur', () => { sprintHeld = false; });

  const promptEl = document.createElement('div');
  promptEl.className = 'vn-prompt';
  sceneEl.appendChild(promptEl);

  function getActionLabel() {
    const mode = modeState.mode;
    if (mode === 'joysticks') return 'ACT';
    if (mode === 'wasd-arrows') return 'ENTER';
    if (mode === 'wasd-mouse') return 'CLICK';
    return modeState.touchDevice ? 'ACT' : 'CLICK';
  }

  function updateInteractionPrompt() {
    const target = (activeScript || isSettingsOpen()) ? null : findAimedInteractable();
    const text = target ? `${getActionLabel()} \u2022 ${target.prompt || 'INTERACT'}` : '';
    if (text === lastPrompt) return;

    lastPrompt = text;
    promptEl.textContent = text;
    promptEl.classList.toggle('is-visible', text !== '');
  }

  const shardHudEl = document.createElement('div');
  shardHudEl.className = 'vn-shard-hud';
  sceneEl.appendChild(shardHudEl);

  function updateShardHud() {
    shardHudEl.textContent = `\u2726 ${shardsFound} / ${EXTRAS.shardCount}`;
  }

  function collectShard(shard) {
    interactables.splice(interactables.indexOf(shard), 1);
    shard.el.remove();
    shardsFound++;
    updateShardHud();
    playChime();
    if (shardsFound === EXTRAS.shardCount) startDialogue(SHARD_FINALE, 0, null);
  }

  function createShardsRemaining() {
    const worldEl = spriteEl.parentElement;
    const remaining = Math.max(0, EXTRAS.shardCount - shardsFound);
    for (let i = 0; i < remaining; i++) {
      const angle = ((i + Math.random() * 0.6) / Math.max(1, remaining)) * Math.PI * 2;
      const radius = EXTRAS.shardMinRadius + Math.random() * (EXTRAS.shardMaxRadius - EXTRAS.shardMinRadius);

      const el = document.createElement('div');
      el.className = 'vn-shard';
      worldEl.appendChild(el);

      interactables.push({
        id: `shard-${i}`,
        x: Math.cos(angle) * radius,
        z: Math.sin(angle) * radius,
        radius: 26, range: 170, solid: false, billboard: true,
        prompt: 'COLLECT',
        el,
        onInteract() { collectShard(this); }
      });
    }
  }

  function createShards() {
    createShardsRemaining();
  }

  createDoorInteractable();
  createShards();
  updateShardHud();

  function keyAxis(neg, pos) {
    return (keys.has(pos) ? 1 : 0) - (keys.has(neg) ? 1 : 0);
  }

  function gameLoop(now) {
    requestAnimationFrame(gameLoop);
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    if (dt <= 0) return;

    if (stepNpcWander(dt)) dirty = true;
    if (stepInteractAlign(dt)) dirty = true;

    const settingsOpen = isSettingsOpen();
    const walkLocked = settingsOpen || activeScript !== null;

    if (!settingsOpen) {
      const yawIn = clamp(lookStick.x + keyAxis('ArrowLeft', 'ArrowRight'), -1, 1);
      const pitchIn = clamp(-lookStick.y + keyAxis('ArrowDown', 'ArrowUp'), -1, 1);
      if (yawIn || pitchIn) {
        const ySign = TUNING.invertLookY ? -1 : 1;
        lookBy(yawIn * TUNING.turnSpeed * dt, pitchIn * TUNING.pitchSpeed * ySign * dt, true);
      }
    }

    let forward = 0;
    let strafe = 0;
    if (walkLocked) {
      player.velF = 0;
      player.velR = 0;
    } else {
      forward = -moveStick.y + keyAxis('KeyS', 'KeyW');
      strafe = moveStick.x + keyAxis('KeyA', 'KeyD');
    }
    TUNING.maxSpeed = BASE_MAX_SPEED * (sprintHeld && forward > 0 ? EXTRAS.sprintMultiplier : 1);
    if (stepMovement(dt, forward, strafe)) dirty = true;
    updateFeel(dt);
    updateInteractionPrompt();

    if (dirty) {
      dirty = false;
      renderCamera();
    }
  }

  updateScreenScale();
  window.addEventListener('resize', updateScreenScale);
  window.addEventListener('orientationchange', () => {
    updateScreenScale();
    setTimeout(updateScreenScale, 120);
  });

  if (HALLWAY.active) {
    unloadCircularRoom();
    loadHallwayRoom();
  } else {
    unloadHallwayRoom();
    loadCircularRoom();
  }
  resetHeartsVisual();
  endDialogue();
  updateCursorVisibility();
  renderCamera();
  requestAnimationFrame(gameLoop);
});
</script>
