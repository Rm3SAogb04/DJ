<!DOCTYPE html>
<!--
  DANJOSHI'S ROOM — SOURCE MAP

  1. Main room styles and responsive layout
  2. Room scene, HUD, drawers, and interaction overlays
  3. External UFO catcher page (ufo-catcher.html)
  4. Main room runtime
     - Room configuration and base furniture catalog
     - Shared state, persistence, rendering, and inventory
     - Audio, NPC dialogue, movement, and camera
     - Build mode, options, and Pomodoro tools
     - Extended systems: pets, art, ukulele, sleep, journal,
       alarm, coffee, hourly clock, meal check-ins, and gym

  Editing guide:
  - Add standard room furniture in the PROPS catalog.
  - Add companion and wellness systems in the room extension bundle.
  - STORE_KEY-backed data is browser-local; it is not a global publish service.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- YouTube embeds require a usable referrer; keep the origin while omitting the page path. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>DANJOSHI's Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">

  <!-- ===== 1. Styles ===== -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    [hidden] {
      display: none !important;
    }
    :root {
      --ink: #2c3e50;
      --paper: #fffdf9;
      --p-pink: #ffd6e7;
      --p-peach: #ffe5b4;
      --p-butter: #fff9b0;
      --p-mint: #caffbf;
      --p-sky: #bde0fe;
      --p-lilac: #e2c6ff;
    }
    /* Blogger page viewport lock: the room must own the visible browser canvas. */
    html, body {
      background: #f3e5ec !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      overflow: hidden !important;
      position: fixed !important;
      inset: 0 !important;
      font-family: 'Press Start 2P', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', 'Segoe UI Symbol', 'Noto Sans Symbols 2', monospace !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    /* Neutralize Blogger's post column so its width/padding cannot scale or offset the room. */
    .post-body, .entry-content, .post, .blog-posts, #main, main, .main-wrap, article, .hentry {
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
      position: static !important;
      max-width: none !important;
      width: auto !important;
    }
    /* Hide the surrounding blog chrome; keep the room's own HUD and drawers untouched. */
    .site-header, .Header, #header, #navbar, .sidebar, #sidebar, .blog-pager,
    .post-header, .post-footer, .comments, #comments, .site-footer, #footer,
    .blog-header, .blog-footer {
      display: none !important;
    }
    button {
      font-family: inherit;
      color: inherit;
    }
    /* ---------- Stage: fixed design canvas (800x600, or 540x960 in portrait) scaled to fit ---------- */
    #stage {
      --design-w: 800px;
      --design-h: 600px;
      --ui-h: 186px;
      --fs: 20px;
      --scale: 1;
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
      z-index: 2147483000 !important;
      user-select: none;
      -webkit-user-select: none;
      background: transparent;
      overflow: hidden;
    }
    #stage[data-orient="portrait"] {
      --design-w: 540px;
      --design-h: 960px;
      --ui-h: 232px;
      --fs: 17px;
    }
    #frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      box-shadow: none;
      background: transparent;
      overflow: hidden;
    }
    #canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    /* ---------- Shared pixel button ---------- */
    .pxb {
      --hv: #caffbf;
      background: #fff7ed;
      color: var(--ink);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      font-size: 22.5px;
      line-height: 1.35;
      padding: 7px 8px;
      cursor: pointer;
      text-align: center;
      transition: transform .1s ease, box-shadow .1s ease, background-color .1s ease;
    }
    .pxb:hover, .pxb:focus-visible {
      background: var(--hv);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--ink);
      outline: none;
    }
    .pxb:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--ink);
    }
    .pxb.on {
      background: var(--p-pink);
    }
    /* ---------- Scene / world (the zoomable room) ---------- */
    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: transparent;
    }
    #scene.can-pan {
      cursor: grab;
    }
    #scene.panning {
      cursor: grabbing;
    }
    #world {
      --wall: #fff3d1;
      --floor: #d9a066;
      --tint: rgba(255, 230, 170, .10);
      --sky-a: #bde0fe;
      --sky-b: #e8f6ff;
      --orb: #fff9b0;
      --stars: 0;
      --lamp-o: 0;
      --beam-c: rgba(255, 244, 190, .5);
      --beam-o: .28;
      --claw-o: .15;
      position: absolute;
      left: 0;
      top: 0;
      width: 1220px;
      height: 400px;
      transform-origin: 0 0;
      overflow: hidden;
      background: var(--wall);
      border: none;
      box-shadow: none;
    }
    #world[data-light="evening"] {
      --tint: rgba(255, 140, 70, .17);
      --sky-a: #ff9e7a;
      --sky-b: #ffd6a5;
      --orb: #ffb347;
      --stars: 0;
      --lamp-o: .85;
      --beam-c: rgba(255, 170, 90, .5);
      --beam-o: .2;
      --claw-o: .35;
    }
    #world[data-light="night"] {
      --tint: rgba(28, 22, 96, .40);
      --sky-a: #1d1b4d;
      --sky-b: #3b2f7a;
      --orb: #f4f1ff;
      --stars: 1;
      --lamp-o: 1;
      --beam-c: rgba(170, 190, 255, .45);
      --beam-o: .12;
      --claw-o: .55;
    }
    #world > * {
      position: absolute;
      pointer-events: none;
    }
    /* back wall */
    #wall {
      left: 0;
      top: 0;
      width: 1220px;
      height: 300px;
      background: var(--wall);
      transition: background-color .6s ease;
    }
    #wall::before {
      content: '';
      position: absolute;
      inset: 0;
    }
    #wall::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(44, 62, 80, .16), rgba(44, 62, 80, 0) 28%, rgba(44, 62, 80, 0) 78%, rgba(44, 62, 80, .10));
    }
    #world[data-wall="stripes"] #wall::before {
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .30) 0 28px, rgba(255, 255, 255, 0) 28px 56px);
    }
    #world[data-wall="grid"] #wall::before {
      background: linear-gradient(rgba(44, 62, 80, .10) 2px, transparent 2px) 0 0 / 40px 40px, linear-gradient(90deg, rgba(44, 62, 80, .10) 2px, transparent 2px) 0 0 / 40px 40px;
    }
    #world[data-wall="dots"] #wall::before {
      background: radial-gradient(rgba(255, 255, 255, .5) 3px, transparent 3.5px) 0 0 / 32px 32px;
    }
    #world[data-wall="wainscot"] #wall::before {
      background: linear-gradient(transparent 62%, rgba(44, 62, 80, .22) 62% 63.4%, rgba(255, 255, 255, .22) 63.4%);
    }
    #world[data-wall="stars"] #wall::before {
      background: radial-gradient(rgba(255, 255, 255, .75) 1.6px, transparent 2.2px) 0 0 / 90px 90px, radial-gradient(rgba(255, 255, 255, .5) 1px, transparent 1.6px) 40px 55px / 70px 70px;
    }
    #base {
      left: 0;
      top: 288px;
      width: 1220px;
      height: 12px;
      background: rgba(44, 62, 80, .30);
      border-top: 2px solid rgba(44, 62, 80, .45);
    }
    /* floor */
    #floor {
      left: 0;
      top: 300px;
      width: 1220px;
      height: 100px;
      background: var(--floor);
      transition: background-color .6s ease;
    }
    #floor::before {
      content: '';
      position: absolute;
      inset: 0;
    }
    #floor::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(0, 0, 0, .24), rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, .06));
    }
    #world[data-floor="grid"] #floor::before {
      background: linear-gradient(rgba(44, 62, 80, .20) 2px, transparent 2px) 0 0 / 40px 20px, linear-gradient(90deg, rgba(44, 62, 80, .20) 2px, transparent 2px) 0 0 / 40px 20px;
    }
    #world[data-floor="planks"] #floor::before {
      background: repeating-linear-gradient(rgba(0, 0, 0, .18) 0 2px, transparent 2px 20px), repeating-linear-gradient(90deg, rgba(0, 0, 0, .12) 0 2px, transparent 2px 130px), repeating-linear-gradient(rgba(255, 255, 255, .07) 0 8px, transparent 8px 20px);
    }
    #world[data-floor="tiles"] #floor::before {
      background: linear-gradient(rgba(44, 62, 80, .18) 2px, transparent 2px) 0 0 / 50px 25px, linear-gradient(90deg, rgba(44, 62, 80, .18) 2px, transparent 2px) 0 0 / 50px 25px;
    }
    #world[data-floor="checker"] #floor::before {
      background: conic-gradient(rgba(255, 255, 255, .30) 25%, transparent 0 50%, rgba(255, 255, 255, .30) 0 75%, transparent 0) 0 0 / 50px 50px;
    }
    #world[data-floor="carpet"] #floor::before {
      background: radial-gradient(rgba(255, 255, 255, .28) 1.5px, transparent 2px) 0 0 / 10px 10px;
    }
    #ceil {
      left: 0;
      top: 0;
      width: 1220px;
      height: 30px;
      background: linear-gradient(rgba(44, 62, 80, .30), transparent);
    }
    #edge-l, #edge-r {
      top: 0;
      width: 38px;
      height: 400px;
    }
    #edge-l {
      left: 0;
      background: linear-gradient(90deg, rgba(44, 62, 80, .45), rgba(44, 62, 80, 0));
    }
    #edge-r {
      right: 0;
      background: linear-gradient(270deg, rgba(44, 62, 80, .45), rgba(44, 62, 80, 0));
    }
    /* props (furniture) */
    .prop {
      position: absolute;
      pointer-events: none;
      transform-origin: 50% 100%;
    }
    .prop svg, .claw svg {
      display: block;
      overflow: visible;
    }
    .prop.interactive {
      pointer-events: auto;
      cursor: pointer;
    }
    .prop.interactive::after {
      content: '';
      position: absolute;
      inset: -4px;
      border: 3px solid transparent;
      transition: border-color .15s ease;
      pointer-events: none;
    }
    .prop.interactive:hover::after, .prop.interactive:focus-visible::after {
      border-color: #ff69b4;
    }
    .prop.interactive .hint {
      position: absolute;
      left: 50%;
      top: -28px;
      transform: translate(-50%, 4px);
      opacity: 0;
      white-space: nowrap;
      padding: 4px 8px;
      border: 2px solid #fff;
      border-radius: 999px;
      background: rgba(255, 117, 143, .95);
      color: #fff;
      font-size: 20px;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    .prop.interactive:hover .hint, .prop.interactive:focus-visible .hint {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    #world.editing .prop,
    #world.editing .claw {
      pointer-events: auto;
      cursor: grab;
      outline: 2px dashed rgba(44, 62, 80, .45);
      outline-offset: 2px;
      touch-action: none;
    }
    #world.editing .prop.drag,
    #world.editing .claw.drag {
      cursor: grabbing;
      outline-color: #ff4d8d;
    }
    #world.editing .claw .hint,
    #world.editing .prop .hint {
      display: none;
    }
    #world.editing .prop.interactive::after {
      display: none;
    }
    .sky-a {
      fill: var(--sky-a);
      transition: fill 1.2s ease;
    }
    .sky-b {
      fill: var(--sky-b);
      transition: fill 1.2s ease;
    }
    .orb {
      fill: var(--orb);
      transition: fill 1.2s ease;
    }
    .stars {
      opacity: var(--stars);
      transition: opacity 1.2s ease;
    }
    /* claw machine (static, always in the room) */
    .claw {
      pointer-events: auto !important;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      z-index: 5;
      transform-origin: 50% 100%;
    }
    .claw::after {
      content: '';
      position: absolute;
      inset: -4px;
      border: 3px solid transparent;
      transition: border-color .15s ease;
      pointer-events: none;
    }
    .claw:hover::after, .claw:focus-visible::after {
      border-color: #ff69b4;
    }
    .claw:focus-visible {
      outline: none;
    }
    .claw .hint {
      position: absolute;
      left: 50%;
      top: -30px;
      transform: translate(-50%, 4px);
      opacity: 0;
      white-space: nowrap;
      padding: 4px 9px;
      border: 2px solid #fff;
      border-radius: 999px;
      background: rgba(255, 117, 143, .95);
      color: #fff;
      font-size: 22.5px;
      pointer-events: none;
      transition: opacity .15s ease, transform .15s ease;
    }
    .claw:hover .hint, .claw:focus-visible .hint {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .led {
      animation: led 2.6s ease-in-out infinite;
    }
    .arm {
      animation: sway 7s ease-in-out infinite alternate;
    }
    @keyframes led {
      0%, 100% {
        opacity: .35;
      }
      50% {
        opacity: 1;
      }
    }
    @keyframes sway {
      from {
        transform: translateX(-22px);
      }
      to {
        transform: translateX(22px);
      }
    }
    /* lighting layers */
    #tint {
      left: 0;
      top: 0;
      width: 1220px;
      height: 400px;
      background-color: var(--tint);
      transition: background-color 1.2s ease;
      z-index: 20;
    }
    .glow {
      border-radius: 50%;
      z-index: 21;
      transition: opacity 1.2s ease;
    }
    #glow-lamp {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(255, 224, 140, .60), rgba(255, 224, 140, 0) 66%);
      opacity: var(--lamp-o);
    }
    #glow-claw {
      width: 330px;
      height: 330px;
      background: radial-gradient(circle, rgba(255, 150, 215, .50), rgba(255, 150, 215, 0) 66%);
      opacity: var(--claw-o);
    }
    #beam {
      width: 330px;
      height: 290px;
      z-index: 21;
      background-color: var(--beam-c);
      opacity: var(--beam-o);
      clip-path: polygon(0 0, 120px 0, 330px 100%, 180px 100%);
      transition: opacity 1.2s ease, background-color 1.2s ease;
    }
    #vig {
      left: 0;
      top: 0;
      width: 1220px;
      height: 400px;
      z-index: 40;
      background: radial-gradient(ellipse at 50% 55%, rgba(44, 62, 80, 0) 55%, rgba(44, 62, 80, .20) 100%);
    }
    /* ---------- NPC: DANJOSHI + OUTFITS ---------- */
    .npc {
      --outfit-main: #2c3e50;
      --outfit-accent: #ff69b4;
      --outfit-shoe: #2c3e50;
      position: absolute !important;
      left: 0;
      top: 0;
      width: 44px;
      height: 112px;
      z-index: 30;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      pointer-events: auto !important;
      transform-origin: 50% 100%;
    }
    .npc:focus-visible {
      outline: 3px solid #ff4d8d;
      outline-offset: 6px;
    }
    .character-call-fading {
      opacity: 0 !important;
      transition: opacity .22s ease !important;
    }
    .character-call-jumping {
      transition: transform .48s cubic-bezier(.2,.8,.25,1) !important;
    }
    .npc-shadow {
      position: absolute;
      left: -4px;
      right: -4px;
      bottom: -3px;
      height: 10px;
      border-radius: 50%;
      background: rgba(44, 62, 80, .22);
    }
    .npc-fig {
      position: absolute;
      inset: 0;
      display: block;
    }
    .npc-body {
      position: absolute;
      left: 0;
      top: 0;
      width: 44px;
      height: 104px;
      background: var(--outfit-main);
      transform-origin: 50% 100%;
      animation: breathe 3.4s ease-in-out infinite;
      transition: background-color .2s ease;
    }
    .npc-acc {
      position: absolute;
      pointer-events: none;
      transition: all .2s ease;
    }
    .npc[data-outfit="classic"] .npc-acc {
      display: none;
    }
    .npc[data-outfit="strawberry"] .npc-acc {
      display: block;
      left: 4px;
      top: 44px;
      width: 36px;
      height: 10px;
      background: #ff85b3;
      border-top: 2px solid #fffdf9;
      border-bottom: 2px solid #fffdf9;
    }
    .npc[data-outfit="starry"] .npc-acc {
      display: block;
      left: 8px;
      top: 10px;
      width: 28px;
      height: 5px;
      background: #ffe66d;
      box-shadow: 0 38px 0 #ffe66d;
    }
    .npc[data-outfit="minty"] .npc-acc {
      display: block;
      left: 6px;
      top: 48px;
      width: 32px;
      height: 8px;
      background: #fffdf9;
    }
    .npc[data-outfit="lilac"] .npc-acc {
      display: block;
      left: 12px;
      top: 38px;
      width: 20px;
      height: 7px;
      background: #ffd6e7;
    }
    .npc[data-outfit="sunny"] .npc-acc {
      display: block;
      left: 2px;
      top: 42px;
      width: 40px;
      height: 7px;
      background: #ff6b8b;
    }
    .npc[data-facing="back"] .npc-acc {
      opacity: 0.35;
    }
    .eye {
      position: absolute;
      top: 20px;
      width: 7px;
      height: 10px;
      background: var(--paper);
      transform-origin: 50% 50%;
      animation: blink 5.5s steps(1) infinite;
      transition: opacity .16s ease;
    }
    .npc[data-dir="1"] .e1 {
      left: 22px;
    }
    .npc[data-dir="1"] .e2 {
      left: 33px;
    }
    .npc[data-dir="-1"] .e1 {
      left: 4px;
    }
    .npc[data-dir="-1"] .e2 {
      left: 15px;
    }
    .npc[data-facing="back"] .eye {
      opacity: 0;
    }
    .npc-feet i {
      position: absolute;
      bottom: 0;
      width: 15px;
      height: 9px;
      background: var(--outfit-shoe);
      border-top: 2px solid #fffdf9;
      transition: background-color .2s ease;
    }
    .npc-feet i:nth-child(1) {
      left: 5px;
    }
    .npc-feet i:nth-child(2) {
      right: 5px;
    }
    .npc.walking .npc-fig {
      animation: bob .5s steps(2) infinite;
    }
    .npc.walking .npc-feet i:nth-child(1) {
      animation: foot .5s steps(2) infinite;
    }
    .npc.walking .npc-feet i:nth-child(2) {
      animation: foot .5s steps(2) infinite reverse;
    }
    .npc.hop .npc-fig {
      animation: hop .32s ease-out 1;
    }
    @keyframes breathe {
      0%, 100% {
        transform: scaleY(1);
      }
      50% {
        transform: scaleY(1.025);
      }
    }
    @keyframes blink {
      0%, 95%, 100% {
        transform: scaleY(1);
      }
      96%, 99% {
        transform: scaleY(.12);
      }
    }
    @keyframes bob {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-3px);
      }
    }
    @keyframes foot {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-3px);
      }
    }
    @keyframes hop {
      0% {
        transform: translateY(0);
      }
      45% {
        transform: translateY(-14px);
      }
      100% {
        transform: translateY(0);
      }
    }
    .npc-tag {
      position: absolute;
      left: 50%;
      top: -20px;
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 0;
      font-size: 20px;
      letter-spacing: 1px;
      background: none;
      color: var(--ink);
      border: none;
      box-shadow: none;
      text-shadow: -1px -1px 0 var(--p-pink), 1px -1px 0 var(--p-pink), -1px 1px 0 var(--p-pink), 1px 1px 0 var(--p-pink), 0 0 6px #fffdf9;
    }
    .npc-bubble {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 12px);
      width: 196px;
      margin-left: -98px;
      padding: 2px 4px;
      font-size: 22.5px;
      line-height: 1.5;
      text-align: center;
      color: var(--ink);
      white-space: pre-line;
      background: none;
      border: none;
      box-shadow: none;
      text-shadow: -1px -1px 0 #fffdf9, 1px -1px 0 #fffdf9, -1px 1px 0 #fffdf9, 1px 1px 0 #fffdf9, 0 0 8px #fffdf9;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none;
    }
    .npc-bubble.show {
      opacity: 1;
      transform: translateY(0);
    }
    .npc-bubble::after {
      content: none;
    }
    /* ---------- HUD (top bar) ---------- */
    .hud {
      position: fixed;
      top: 12px;
      left: 14px;
      right: 14px;
      z-index: 26;
      display: flex;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }
    .hud > * {
      pointer-events: auto;
    }
    .sq {
      width: 38px;
      height: 38px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;

   * - Desk tools: Pomodoro, notes, and task list
   * - Companion systems: pets, care, follow/call, wardrobe, and inventory

   * Keep feature state, content builders, and action handlers together.

  // -----------------------------------------------------------------------------

  const GYM_OFFSET = 420;
  const W = 1220, H = 400;
  const MAIN_ROOM_CENTER = GYM_OFFSET + 400;

  const SIDE_MARGIN = 46;
  const ZMIN = 1, ZMAX = 3;
  const STORE_KEY = 'danjoshiRoom.v1';
  const NPC_NAME = 'DANJOSHI';
  const INK = '#2c3e50';

  const bgm = new Audio();

  function fadeBgmTo(target, onDone) {
    clearInterval(bgmFadeTimer);

    const duration = 420;
    const started = performance.now();
    bgmFadeTimer = setInterval(() => {

  }
  function fadeBgmOutForMedia() {

  }
  function fadeBgmInAfterMedia() {

  let pomoTickAccum = 0;
  function stepPomodoro(dt) {
    if (pomo.phase !== 'focus' && pomo.phase !== 'break') return;
    pomoTickAccum += dt;
    while (pomoTickAccum >= 1) {
      pomoTickAccum -= 1;
      pomo.remainingSec = Math.max(0, pomo.remainingSec - 1);
      if (pomo.remainingSec <= 0) {
        if (pomo.phase === 'focus') {
          pomo.completedCycles += 1;
          pomo.phase = 'break';
          pomo.remainingSec = pomo.breakMins * 60;
          blip(880, 0.12, 0.09, 'triangle');
          say('Focus session complete! Time for a ' + pomo.breakMins + '-min break.', 5500);
        } else {
          pomo.phase = 'focus';
          pomo.remainingSec = pomo.focusMins * 60;
          blip(660, 0.12, 0.09, 'triangle');
          say('Break is over! Ready for another focus block?', 5500);
        }

      }

    }

  async function loadRoomPrizeCatalog() {
    if (roomPrizeCatalog.length) return roomPrizeCatalog;
    if (!roomPrizeCatalogPromise) {
      roomPrizeCatalogPromise = fetch(UFO_PRIZE_JSON_URL, { cache: 'no-cache' })
        .then((response) => {
          if (!response.ok) throw new Error(`gft.json request failed (${response.status})`);
          return response.json();
        })
        .then((data) => {
          const rows = Array.isArray(data) ? data : data && data.prizes;
          if (!Array.isArray(rows)) throw new Error('gft.json must contain a prizes array');
          const seen = new Set();
          const safe = rows.map((prize, index) => ({
            id: String(prize && prize.id || `gft-${String(index + 1).padStart(3, '0')}`),
            url: String(prize && prize.url || ''),
            title: String(prize && prize.title || 'UNTITLED PRIZE'),
            caption: String(prize && prize.caption || '')
          })).filter((prize) => {
            if (!/^https:\/\//i.test(prize.url) || seen.has(prize.url)) return false;
            seen.add(prize.url);
            return true;
          });
          if (!safe.length) throw new Error('gft.json contains no usable prize entries');
          roomPrizeCatalog = safe;
          return roomPrizeCatalog;
        })
        .catch((error) => {

        });

  function loadUfoGameSource(index) {
    if (!ufoOpen || !ufoFrame) return;
    clearUfoReadyTimer();
    if (ufoFetchController) { try { ufoFetchController.abort(); } catch (_) { } ufoFetchController = null; }
    ufoGameReady = false;

    if (index >= UFO_GAME_SOURCES.length) {
      showUfoLoadError('THE UFO CATCHER FILE COULD NOT LOAD. CHECK THAT ufo-catcher.html IS COMMITTED TO THE DJ REPOSITORY, OR ADD A BLOGGER FALLBACK URL.');
      return;
    }

    const source = UFO_GAME_SOURCES[index];
    ufoOverlay.classList.remove('ready');

    // Timeout covers both downloading the separate HTML file and its game-ready handshake.
    ufoReadyTimer = setTimeout(() => {
      if (!ufoOpen || ufoGameReady) return;
      if (ufoFetchController) { try { ufoFetchController.abort(); } catch (_) { } ufoFetchController = null; }
      if (index + 1 < UFO_GAME_SOURCES.length) {
        loadUfoGameSource(index + 1);

    if (source.type === 'page') {
      // Optional Blogger fallback: load a published page directly in the iframe.
      ufoFrame.src = source.url;
      return;
    }

    const controller = new AbortController();
    ufoFetchController = controller;
    fetch(source.url, { cache: 'no-cache', mode: 'cors', signal: controller.signal })
      .then((response) => {
        if (!response.ok) throw new Error(`ufo-catcher.html request failed (${response.status})`);
        return response.text();
      })
      .then((html) => {
        if (!ufoOpen || !ufoFrame || controller.signal.aborted || ufoFetchController !== controller) return;
        // Guard against uploading the wrong file or a GitHub 404/error page.
        if (!/<!doctype\s+html/i.test(html) || !html.includes('id="arcadeStage"') || !html.includes('id="ufoCanvas"')) {
          throw new Error('The fetched file is not the expected standalone UFO catcher HTML.');

        ufoFetchController = null;
        // srcdoc runs the fetched page in an isolated iframe while inheriting the room's origin.
        // This keeps game logic separate but lets the room and game exchange prize progress safely.
        ufoFrame.srcdoc = html;
      })
      .catch((error) => {
        if (controller.signal.aborted || !ufoOpen) return;
        console.error('Could not fetch standalone UFO catcher HTML:', error);
        clearUfoReadyTimer();
        if (index + 1 < UFO_GAME_SOURCES.length) loadUfoGameSource(index + 1);
        else showUfoLoadError('CANNOT FETCH ufo-catcher.html FROM GITHUB RAW. CHECK THE FILE NAME, PUBLIC REPOSITORY, AND gft.json URL.');
      });
  }

          if (!ctx) return;
          const now = ctx.currentTime;

            confirm: [523.25, 0.05, 783.99, 0.08]
          }[kind] || [660, 0.06];

          for (let i = 0; i < notes.length; i += 2) {
            const freq = notes[i];
            const dur = notes[i + 1];
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = kind === 'bath' ? 'triangle' : 'square';

            osc.start(now + i * 0.045);

        rc(14, 22, 20, 12, bodyCol) +
        circ(24, 17, 10, bodyCol) +

        accSvg +

    const petPoops = [];

    // Focus robot: a single-task queue that moves to one pet/poop, completes it,
    // then selects the next task. It never runs concurrent care actions.
    const focusRobotState = { x: 0, y: 0, task: null, phase: 'idle', timer: 0, el: null };
    function ensureFocusRobot() {
      if (focusRobotState.el && focusRobotState.el.isConnected) return focusRobotState.el;
      const robot = document.createElement('div');
      robot.className = 'focus-care-robot';
      robot.setAttribute('aria-label', 'Robot pet-care assistant');
      robot.innerHTML = '<span class="focus-care-bot">🤖</span><small>CARE BOT</small><b class="focus-care-task">READY</b>';
      world.appendChild(robot);
      focusRobotState.el = robot;
      return robot;
    }
    function focusRobotNextTask() {
      if (petPoops.length) {
        const item = petPoops[0];
        return { kind: 'CLEAN', poopId: item.id, x: item.x, y: item.y + 2 };
      }
      const pets = Object.values(tamaState.pets).filter(p => !p.outside);
      const priorities = [
        { kind: 'FEED', key: 'hunger', threshold: 78, amount: 34 },
        { kind: 'BATH', key: 'cleanliness', threshold: 76, amount: 34 },
        { kind: 'PLAY', key: 'happiness', threshold: 76, amount: 32 }
      ];
      for (const priority of priorities) {
        const needy = pets.filter(p => Number(p[priority.key]) < priority.threshold).sort((a, b) => a[priority.key] - b[priority.key])[0];
        if (needy) {
          needy.focusBotFrozen = true;
          needy.mode = 'idle';
          needy.t = 999999;
          return { kind: priority.kind, key: priority.key, amount: priority.amount, petId: needy.id, x: needy.x + 24, y: needy.y + 2 };
        }
      }
      return null;
    }
    function finishFocusRobotTask() {
      const task = focusRobotState.task;
      if (!task) return;
      if (task.kind === 'CLEAN') {
        clearPetPoop(task.poopId);
        retroSfx.play('bath');
      } else {
        const pet = tamaState.pets[task.petId];
        if (pet) {
          pet[task.key] = clamp(Number(pet[task.key] || 0) + task.amount, 0, 100);
          pet.focusBotFrozen = false;
          pet.mode = 'idle';
          pet.t = rand(2.2, 5.5);
          if (task.kind === 'FEED') pet.happiness = clamp(pet.happiness + 4, 0, 100);
          if (task.kind === 'BATH') pet.happiness = clamp(pet.happiness + 3, 0, 100);
          if (task.kind === 'PLAY') pet.hunger = clamp(pet.hunger - 1, 0, 100);
          retroSfx.play(task.kind === 'FEED' ? 'feed' : task.kind === 'BATH' ? 'bath' : 'play');
        }
      }
      renderPets();
      focusRobotState.task = null;
      focusRobotState.phase = 'idle';
      focusRobotState.timer = 0;
    }
    function stepFocusRobot(dt) {
      if (!focusModeActive) return;
      const el = ensureFocusRobot();
      if (!focusRobotState.task) {
        focusRobotState.task = focusRobotNextTask();
        if (focusRobotState.task) focusRobotState.phase = 'moving';
      }
      const task = focusRobotState.task;
      if (task && focusRobotState.phase === 'moving') {
        const dx = task.x - focusRobotState.x;
        const dy = task.y - focusRobotState.y;
        const distance = Math.hypot(dx, dy);
        const speed = 118 * dt;
        if (distance <= Math.max(5, speed)) {
          focusRobotState.x = task.x; focusRobotState.y = task.y;
          focusRobotState.phase = 'working'; focusRobotState.timer = task.kind === 'CLEAN' ? 1.0 : 1.35;
        } else {
          focusRobotState.x += dx / distance * speed;
          focusRobotState.y += dy / distance * speed;
        }
      } else if (task && focusRobotState.phase === 'working') {
        focusRobotState.timer -= dt;
        if (focusRobotState.timer <= 0) finishFocusRobotTask();
      } else if (!task) {
        const desk = state.props.desk;
        const idleX = desk ? desk.x - 82 : MAIN_ROOM_CENTER;
        const idleY = desk ? desk.y + 3 : PROP_BASE_Y;
        focusRobotState.x += (idleX - focusRobotState.x) * Math.min(1, dt * 2);
        focusRobotState.y += (idleY - focusRobotState.y) * Math.min(1, dt * 2);
      }
      el.style.left = `${(focusRobotState.x - 20).toFixed(1)}px`;
      el.style.top = `${(focusRobotState.y - 44).toFixed(1)}px`;
      el.classList.toggle('working', focusRobotState.phase === 'working');
      const label = el.querySelector('.focus-care-task');
      if (label) label.textContent = task ? (focusRobotState.phase === 'working' ? `${task.kind}…` : task.kind) : 'READY';
    }

    function renderPets() {
      Object.values(tamaState.pets).forEach((pet) => {
        const el = petEls[pet.id];

        if (pet.outside) return;
        const sc = depthScaleForFloorY(pet.y) * 0.92 * (characterCall?.who === pet.id ? characterCall.scale : 1);
        el.classList.toggle('character-call-fading', characterCall?.who === pet.id && (characterCall.phase === 'fading' || characterCall.phase === 'restoring'));
        el.classList.toggle('character-call-jumping', characterCall?.who === pet.id && characterCall.phase === 'jumping');
        const hopY = pet.hop > 0 ? -Math.sin(pet.hop * Math.PI) * 9 : 0;
        el.style.zIndex = '46';

        // Only flip the creature SVG so CAT never becomes TAC when it turns.
        // 64x58 hit target; center the 48x42 sprite so the visible pet stays in the same world position.
        el.style.transform = `translate(${(pet.x - 32).toFixed(1)}px, ${(pet.y - 48 + hopY).toFixed(1)}px) scale(${sc})`;
        const hBar = Math.round(pet.hunger / 20);

        const petSvg = el.querySelector('svg');

    function updateClocks() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

    }

    // Time-of-day sky + Jakarta weather sync.
    // Open-Meteo is the weather source. Avoid reading BMKG radar image pixels here:
    // the radar host does not grant browser CORS access to Blogger pages.
    world.dataset.jktWeather = 'clear';
    world.dataset.jktWeatherStatus = 'starting';

    function getSkyPeriod(d = new Date()) {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
      }).formatToParts(d);
      const hour = Number(parts.find((part) => part.type === 'hour')?.value || 0);
      const minute = Number(parts.find((part) => part.type === 'minute')?.value || 0);
      const m = hour * 60 + minute;
      if (m >= 300 && m < 390) return 'dawn';
      if (m >= 390 && m < 480) return 'sunrise';
      if (m >= 480 && m < 720) return 'morning';
      if (m >= 720 && m < 990) return 'afternoon';
      if (m >= 990 && m < 1095) return 'sunset';
      if (m >= 1095 && m < 1170) return 'dusk';
      return 'night';
    }

    async function refreshTimeAndJakartaWeather() {
      world.dataset.sky = getSkyPeriod(new Date());
      try {
        const weatherUrl = 'https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456' +
          '&current=weather_code,precipitation,rain,showers&hourly=precipitation_probability' +
          '&forecast_days=1&timezone=Asia%2FJakarta';
        const weatherResponse = await fetch(weatherUrl, { cache: 'no-store' });
        if (!weatherResponse.ok) throw new Error(`Jakarta weather request failed (${weatherResponse.status})`);
        const json = await weatherResponse.json();
        const current = json?.current || {};
        const rawCode = current.weather_code;
        if (rawCode === null || rawCode === undefined || !Number.isFinite(Number(rawCode))) {
          world.dataset.jktWeather = 'clear';
          world.dataset.jktWeatherStatus = 'no-current-weather-code';
          return;
        }
        const code = Number(rawCode);
        // Open-Meteo current precipitation/rain/showers are recent totals.
        // Require a rain-related weather code plus a recent amount or meaningful probability.
        const recentRainMm = Math.max(
          Number.isFinite(Number(current.precipitation)) ? Number(current.precipitation) : 0,
          Number.isFinite(Number(current.rain)) ? Number(current.rain) : 0,
          Number.isFinite(Number(current.showers)) ? Number(current.showers) : 0
        );
        const hourlyTimes = Array.isArray(json?.hourly?.time) ? json.hourly.time : [];
        const currentHourKey = String(current.time || '').slice(0, 13) + ':00';
        const hourIndex = hourlyTimes.indexOf(currentHourKey);
        const precipProbability = hourIndex >= 0 && Array.isArray(json?.hourly?.precipitation_probability)
          ? Number(json.hourly.precipitation_probability[hourIndex]) || 0
          : 0;

        const isThunderstorm = code >= 95 && code <= 99;
        const isRainCode = [51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82].includes(code);
        const openMeteoRainConfirmed = (isRainCode || isThunderstorm) &&
          (recentRainMm >= 0.1 || precipProbability >= 45);

        if (openMeteoRainConfirmed && isThunderstorm) {
          world.dataset.jktWeather = 'stormy';
          world.dataset.jktWeatherStatus = 'confirmed-storm';
        } else if (openMeteoRainConfirmed && isRainCode) {
          world.dataset.jktWeather = 'rainy';
          world.dataset.jktWeatherStatus = 'confirmed-rain';
        } else {
          world.dataset.jktWeather = 'clear';
          world.dataset.jktWeatherStatus = 'no-rain-confirmed';
        }
        world.dataset.jktWeatherUpdated = new Date().toISOString();
      } catch (_) {
        // Never leave rain running after a failed or incomplete data refresh.
        world.dataset.jktWeather = 'clear';
        world.dataset.jktWeatherStatus = 'weather-unavailable';
      }
    }
    refreshTimeAndJakartaWeather();
    setInterval(refreshTimeAndJakartaWeather, 5 * 60 * 1000);

    // Pet care & wandering step loop
    let petDecayAccum = 0;
    function stepTamaPets(dt) {
      petDecayAccum += dt;

        petDecayAccum -= 12;

          p.hunger = clamp(p.hunger - 1, 0, 100);
          p.cleanliness = clamp(p.cleanliness - 1, 0, 100);
          p.happiness = clamp(p.happiness - 1, 0, 100);
        });
      }
      Object.values(tamaState.pets).forEach((p) => {
        if (characterCall?.who === p.id) return;
        if (p.focusBotFrozen) return;
        if (p.outside) {
          if (Date.now() >= p.outsideUntil) {
            p.outside = false; p.outsideUntil = 0; p.mode = 'idle'; p.t = rand(2.2, 5.2);
            p.x = clamp(p.x, SIDE_MARGIN + 24, W - SIDE_MARGIN - 24);
            p.happiness = clamp(p.happiness + 9, 0, 100);

            say(`${p.name} is back from a little walk!`, 2300);

        if (p.hop > 0) p.hop = Math.max(0, p.hop - dt * 2.4);
        if (p.mode === 'walk') {
          const dx = p.tx - p.x;
          const dy = p.ty - p.y;
          const dist = Math.hypot(dx, dy);
          const spd = 34 * dt;
          if (dist <= spd) {
            p.x = p.tx; p.y = p.ty; p.mode = 'idle'; p.t = rand(2.2, 5.5);
          } else {
            p.x += (dx / dist) * spd;
            p.y += (dy / dist) * spd;
            if (Math.abs(dx) > 0.3) p.dir = dx > 0 ? 1 : -1;
          }
        } else {
          p.t -= dt;
          if (p.t <= 0) {

              p.tx = rand(SIDE_MARGIN + 20, W - SIDE_MARGIN - 20);
              p.ty = rand(NPC_MIN_Y, NPC_MAX_Y);
              p.mode = 'walk';

            }
          }
        }
      });

    cancelAnimationFrame(raf);

    // Follow & Call helpers for NPC, Cat, and Dog

    function applyFollowChoice(choice) {

    function moveCharacterToViewport(who, xRatio, yRatio) {
      const m = viewMetrics();
      const scale = m.fit * cam.z;
      const x = clamp(cam.cx + (m.vw * xRatio - m.vcx) / scale, 0, W);
      const y = clamp(cam.cy + (m.vh * yRatio - m.vcy) / scale, 0, H);
      if (who === 'npc') {

    function restoreCalledCharacter() {

    scene.addEventListener('click', (event) => {

    function callEntity(who) {
      if (characterCall) return;

      autoFollowNpc = false;
      followTrackingEnabled = false;

    function artThumbUrl(url) {

      let thumb = raw
        .replace(/\/s\d+\//gi, '/s96/')
        .replace(/=s\d+/gi, '=w96-h96-c')
        .replace(/=w\d+-h\d+[^&]*/gi, '=w96-h96-c');

    async function resolveYoutubeChannelId(entry) {
      if (entry.channelId) return entry.channelId;
      const handle = extractYoutubeHandle(entry.channelUrl);
      if (!handle) throw new Error(`Add a YouTube channel URL using /@handle/live, or provide channelId, for ${entry.title}.`);
      const cacheKey = `${STORE_KEY}.youtube-channel.${handle.toLowerCase()}`;

    async function findYoutubeChannelLiveVideo(entry) {
      if (entry.videoId) return entry.videoId;

      const resolvedChannelId = await resolveYoutubeChannelId(entry);
      const cacheKey = `${STORE_KEY}.youtube-live.${resolvedChannelId}`;
      const cached = youtubeLiveLookupCache.get(resolvedChannelId);
      if (cached && Date.now() - cached.time < YOUTUBE_LIVE_CACHE_MS) return cached.videoId;
      try {
        const saved = JSON.parse(localStorage.getItem(cacheKey) || 'null');
        if (saved && Number.isFinite(saved.time) && typeof saved.videoId === 'string' && Date.now() - saved.time < YOUTUBE_LIVE_CACHE_MS) {
          youtubeLiveLookupCache.set(resolvedChannelId, saved);
          return saved.videoId;
        }
      } catch (_) { }

      const endpoint = new URL('https://www.googleapis.com/youtube/v3/search');
      endpoint.searchParams.set('part', 'snippet');
      endpoint.searchParams.set('channelId', resolvedChannelId);
      endpoint.searchParams.set('eventType', 'live');
      endpoint.searchParams.set('type', 'video');
      endpoint.searchParams.set('videoEmbeddable', 'true');
      endpoint.searchParams.set('maxResults', '1');
      endpoint.searchParams.set('key', livestreamYoutubeApiKey);

      const videoId = result.items && result.items[0] && result.items[0].id && result.items[0].id.videoId || '';
      const cacheValue = { time: Date.now(), videoId };
      youtubeLiveLookupCache.set(resolvedChannelId, cacheValue);
      try { localStorage.setItem(cacheKey, JSON.stringify(cacheValue)); } catch (_) { }
      return videoId;
    }

    async function loadLivestreamList(force = false) {
      if (livestreamLoadPromise) return livestreamLoadPromise;
      if (livestreamLoaded && !force) return;
      if (force) twitchUnavailableIds.clear();
      livestreamLoading = true;
      livestreamLoadError = '';
      livestreamYoutubeKeyMissing = false;
      livestreamLoadPromise = (async () => {
        try {
          // Cache-busting avoids stale GitHub raw/CDN copies after livestream.json is replaced.
          const requestUrl = new URL(LIVESTREAM_JSON_URL);
          requestUrl.searchParams.set('_roomtv', String(Date.now()));
          const response = await fetch(requestUrl.toString(), { cache: 'no-store', mode: 'cors' });
          if (!response.ok) throw new Error(`livestream.json request failed (${response.status})`);
          const data = await response.json();
          livestreamYoutubeApiKey = String(data && (data.youtubeApiKey || (data.youtube && data.youtube.apiKey)) || '').trim();

          const candidates = livestreamAllEntries.filter(item => item.enabled);

          livestreamChannelLinks = livestreamAllEntries;
          livestreamYoutubeKeyMissing = !livestreamYoutubeApiKey && candidates.some(item => item.platform === 'youtube' && !item.videoId);
          const playable = [];

            if (item.platform === 'youtube') {
              if (!item.videoId && !livestreamYoutubeApiKey) {
                lookupErrors.push('YouTube channel auto-detection needs a YouTube Data API key in livestream.json. Twitch entries can still play without it.');
                continue;
              }
              try {
                const liveVideoId = await findYoutubeChannelLiveVideo(item);
                if (!liveVideoId) continue; // Channel is not live right now; try the next ranked entry.
                item.resolvedVideoId = liveVideoId;
                playable.push(item);
              } catch (error) {
                lookupErrors.push(error && error.message ? error.message : 'Could not check YouTube channel status.');
              }
            } else {
              playable.push(item); // Twitch channel candidates are checked for ONLINE/OFFLINE after the official player loads.
            }

            else if (!candidates.length && livestreamAllEntries.length) livestreamLoadError = 'The livestream catalogue has no enabled entries. Set enabled to true for channels you want the TV to try.';
            else if (!livestreamAllEntries.length) livestreamLoadError = 'No valid streams were found. Check the livestream.json format and channel URLs.';
            else livestreamLoadError = 'No enabled channel appears to be live right now. Try refreshing later.';
          }
        } catch (error) {
          livestreamLoadError = error && error.message ? error.message : 'Could not load livestream.json';

          livestreamChannelLinks = [];

      // Twitch requires every ancestor host to be passed as a separate parent parameter.

      cam.follow = false; cam.tz = 1; cam.tcx = MAIN_ROOM_CENTER; cam.tcy = H / 2;
    }
    function recordGymStep(item, detail) {
      addExerciseHistory({ name: item.name, detail });
      retroSfx.play('gym');
    }
    function completeGymStep(detail) {
      const item = gymState.plan[gymState.step]; if (!item) return;
      recordGymStep(item, detail);
      gymState.step++;
      if (gymState.step >= gymState.plan.length) { finishGymPlan(); return; }

    function beginGymWork() {
      const item = gymState.plan[gymState.step]; if (!item) return;

    }
    function cancelGym() { clearInterval(gymInterval); gymInterval = 0; gymState.status = 'idle'; gymState.awaiting = false; gymState.plan = []; npc.mode = 'idle'; npc.t = 2; npcEl.classList.remove('gym-working'); buildGymDrawer(); retroSfx.play('close'); }
    gymDrawer.addEventListener('click', (e) => {

      .room-native-glyph { font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Segoe UI Symbol','Noto Sans Symbols 2',sans-serif !important; font-variant-emoji:emoji; font-weight:normal; letter-spacing:normal; }
      #artDrawer .art-gallery-grid, #standeeDrawer .art-gallery-grid { grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),200px)) !important; justify-content:start; gap:12px; }
      #artDrawer .art-option, #standeeDrawer .art-option { width:200px; max-width:100%; }
      #buildDragGhost { box-sizing:border-box !important; padding:0 !important; border:0 !important; background:transparent !important; box-shadow:none !important; overflow:visible !important; transform:translate(-50%,-50%) !important; }
      #buildDragGhost > svg, #buildDragGhost > img { display:block; width:100% !important; height:100% !important; max-width:none !important; max-height:none !important; object-fit:contain; }
      .tama-rainbow-poop { width:32px !important; min-width:32px !important; max-width:32px !important; height:32px !important; min-height:32px !important; max-height:32px !important; font:22px/1 sans-serif !important; display:grid !important; place-items:center !important; pointer-events:auto !important; touch-action:manipulation !important; z-index:2147483646 !important; }
      #world > .tama-rainbow-poop { pointer-events:auto !important; z-index:2147483646 !important; }
      .tama-rainbow-poop::before { inset:2px !important; opacity:.28 !important; filter:blur(1px) !important; }
      .tama-rainbow-poop:focus-visible { outline:2px solid #ff69b4; outline-offset:1px; }
      .jkt-weather-credit { display:none !important; }
    `;
    document.head.appendChild(roomFinalFixes);

    // Build-mode resize handles for the personal frame and oshi standees.
    const RESIZABLE_PROP_IDS = ['wallPoster', 'albumPosters', 'artFrame', 'oshiStandees'];

    function ensurePropResizeHandle(el) {
      if (!el || !RESIZABLE_PROP_IDS.includes(el.dataset.id) || el.querySelector('.prop-resize-handle')) return;

      const handle = document.createElement('button');
      handle.type = 'button';
      handle.className = 'prop-resize-handle';
      handle.setAttribute('aria-label', 'Resize item');
      handle.title = 'Drag to resize';
      el.appendChild(handle);
    }

    function refreshResizeHandles() {
      Object.values(propEls).forEach(ensurePropResizeHandle);
      propInstanceEls.forEach(ensurePropResizeHandle);
    }

    refreshResizeHandles();

    const resizeObserver = new MutationObserver(refreshResizeHandles);
    resizeObserver.observe(world, { childList: true, subtree: true });

    let propResizeDrag = null;

    world.addEventListener('pointerdown', (e) => {
      const handle = e.target.closest('.prop-resize-handle');
      if (!handle || !buildOpen) return;

      const el = handle.closest('.prop');
      const id = el?.dataset.id;
      if (!el || !['artFrame', 'oshiStandees'].includes(id)) return;

      const instanceId = el.dataset.instanceId || null;
      const stateObj = instanceId ? getPropInstance(instanceId) : state.props[id];
      if (!stateObj) return;

      e.preventDefault();
      e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      suppressRoomClickUntil = Date.now() + 350;

      propResizeDrag = {
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        startScale: Number(stateObj.scale) || 1,
        stateObj,
        el,
        id,
        instanceId
      };
    }, true);

    document.addEventListener('pointermove', (e) => {
      if (!propResizeDrag || e.pointerId !== propResizeDrag.pointerId) return;

      const drag = propResizeDrag;
      const delta = (e.clientX - drag.startX) - (e.clientY - drag.startY);
      drag.stateObj.scale = clamp(drag.startScale + delta / 180, 0.45, 2.8);

      const prop = PROP_BY_ID[drag.id];
      if (prop) positionPropEl(prop, drag.stateObj, drag.el);
      e.preventDefault();
    }, { capture: true, passive: false });

    document.addEventListener('pointerup', (e) => {
      if (!propResizeDrag || e.pointerId !== propResizeDrag.pointerId) return;

      propResizeDrag = null;
      save();
      buildBuildDrawer();
    });

    document.addEventListener('pointercancel', () => {
      propResizeDrag = null;
    });

    world.addEventListener('load', (e) => {
      const img = e.target;
      if (!(img instanceof HTMLImageElement) || !img.classList.contains('art-frame-image')) return;

      img.style.objectFit = 'contain';
      img.style.aspectRatio = `${img.naturalWidth || 1} / ${img.naturalHeight || 1}`;
    }, { capture: true });


  })();
})();
</script>
